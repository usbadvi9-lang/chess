const STAT_DEFS = [{"k":"vertRecoil","label":"Подброс","up":false,"d":2},{"k":"horizRecoil","label":"Увод","up":false,"d":2},{"k":"hipSpread","label":"Разброс от бедра","up":false,"d":2},{"k":"adsTime","label":"Вскидка, с","up":false,"d":3},{"k":"mobility","label":"Подвижность","up":true,"d":0},{"k":"reloadTime","label":"Перезарядка, с","up":false,"d":3},{"k":"muzzleVelocity","label":"Скорость, м/с","up":true,"d":0},{"k":"effectiveRange","label":"Дальность, м","up":true,"d":0},{"k":"loudness","label":"Громкость","up":false,"d":0},{"k":"flashVisible","label":"Заметность вспышки","up":false,"d":0},{"k":"weight","label":"Масса, г","up":false,"d":0},{"k":"magCap","label":"Ёмкость","up":true,"d":0}];

function createCustomizer(opts) {
  const style = document.createElement('style');
  style.textContent = CUST_CSS;
  document.head.appendChild(style);

  const host = document.createElement('div'); host.id = 'cust';
  const warn = document.createElement('div'); warn.id = 'custWarn';
  const list = document.createElement('div'); list.id = 'custList';
  const slots = document.createElement('div'); slots.id = 'custSlots';
  const hint = document.createElement('div'); hint.id = 'custHint';
  hint.textContent = 'TAB — панель · 1…9 — слот · ← → — модуль · B — сошки/приклад · C — фонарь · Z — ЛЦУ · X — режим огня';
  /* Порядок строк сверху вниз: подсказка, сообщение, модули, слоты. */
  host.append(hint, warn, list, slots);
  document.body.appendChild(host);

  const statBox = document.createElement('div'); statBox.id = 'custStats';
  document.body.appendChild(statBox);

  let active = null, prevStats = null, notice = '', noticeTimer = 0;

  function renderSlots(defs, cfg) {
    slots.innerHTML = '';
    defs.forEach((s, i) => {
      const cur = cfg[s.key];
      const el = document.createElement('div');
      el.className = 'cslot' + (active === s.key ? ' on' : '') + (cur ? '' : ' empty');
      const k = document.createElement('div'); k.className = 'k';
      k.textContent = (i < 9 ? (i + 1) + ' · ' : '') + s.label;
      k.title = s.label;
      const v = document.createElement('div'); v.className = 'v';
      v.textContent = cur ? opts.nameOf(cur) : '—';
      v.title = v.textContent;
      el.append(k, v);
      el.onclick = () => { active = s.key; render(); };
      slots.appendChild(el);
      if (active === s.key) requestAnimationFrame(() => {
        el.scrollIntoView({ block: 'nearest', inline: 'center' });
      });
    });
  }

  function renderOptions(cfg) {
    list.innerHTML = '';
    if (!active) return;
    let selected = null;
    for (const o of opts.optionsFor(active)) {
      const el = document.createElement('div');
      const isSel = (cfg[active] || null) === o.key;
      el.className = 'copt' + (isSel ? ' sel' : '');
      el.textContent = o.label;
      el.title = o.label;
      el.onclick = () => { opts.setModule(active, o.key); render(); };
      list.appendChild(el);
      if (isSel) selected = el;
    }
    if (selected) requestAnimationFrame(() => {
      selected.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  }

  function renderStats() {
    const st = opts.getStats();
    statBox.innerHTML = '';
    for (const d of STAT_DEFS) {
      if (st[d.k] === undefined) continue;
      const v = st[d.k], pv = prevStats ? prevStats[d.k] : undefined;
      const changed = pv !== undefined && Math.abs(v - pv) > 1e-6;
      let cls = 'cstat';
      if (changed) cls += ((v > pv) === d.up) ? ' up' : ' dn';
      const row = document.createElement('div');
      row.className = cls;
      const name = document.createElement('span'); name.textContent = d.label;
      const val = document.createElement('b');
      val.textContent = v.toFixed(d.d);
      if (changed) {
        const diff = document.createElement('i');
        const delta = v - pv;
        diff.textContent = (delta > 0 ? '▲' : '▼') + Math.abs(delta).toFixed(d.d);
        val.appendChild(diff);
      }
      row.append(name, val);
      statBox.appendChild(row);
    }
  }

  function render() {
    const cfg = opts.getConfig(), defs = opts.getSlots();
    if (active && !defs.some((s) => s.key === active)) active = null;
    renderSlots(defs, cfg);
    renderOptions(cfg);
    renderStats();
    const w = opts.getWarnings();
    warn.textContent = notice || (w && w.length ? w.join(' · ') : '');
  }

  return {
    render,
    markStats() { prevStats = Object.assign({}, opts.getStats()); },
    setActive(k) { active = k; render(); },
    getActive() { return active; },
    /* Короткое сообщение поверх предупреждений сборки (гаснет само). */
    notify(text) {
      notice = text || '';
      warn.textContent = notice;
      clearTimeout(noticeTimer);
      if (notice) noticeTimer = setTimeout(() => { notice = ''; render(); }, 2600);
    },
    toggle(on) {
      const show = on !== false;
      host.classList.toggle('hidden', !show);
      statBox.style.display = show ? '' : 'none';
      if (show) render();
    },
    visible() { return !host.classList.contains('hidden'); }
  };
}


/* ---- интеграция кастомизации (шаблон, подставляется tools/build.js) ---- */
const ATTACH_DEF = __ATTACH.SLOTS["akm"];
const ATTACH_STATE = {
  config: Object.assign({}, ATTACH_DEF.defaults),
  asm: null, view: null, ui: null,
  toggles: { light: 0, laser: 0, ir: 0, deploy: {} }
};
/* деталь базовой модели -> слот, который её заменяет (для точечного скрытия) */
const ATTACH_HIDE_BY_NAME = {"stock":"stock","buttPlate":"stock","buttSerration":"stock","buttScrew":"stock","swivelRear":"stock","swivelRearBase":"stock","magBody":"mag","magLips":"mag","magFloor":"mag","magCatchLug":"mag","lowerHandguard":"handguard","handguardBand":"handguard","handguardBandRear":"handguard","upperHandguardTop":"handguard","upperHandguardR":"handguard","upperHandguardL":"handguard","upperBand":"handguard","brakeBase":"muzzle","brakeWindow":"muzzle","brakeCrown":"muzzle","brakeDetent":"muzzle","dustCover":"mount","coverNose":"mount","sideRail":"siderail","railTop":"siderail","railBot":"siderail"};

/* Список модулей, подходящих слоту (для интерфейса).
   В списке остаётся только то, что реально встаёт на это место: серые
   «ненажимаемые» карточки не показываются, иначе меню забито мусором. */
function attachOptionsFor(slotKey) {
  const slot = attachSlots().find((s) => s.key === slotKey);
  if (!slot) return [];
  const accepts = __ATTACH.SYS.slotAccepts(slot);
  const out = [{ key: null, label: '— НЕТ —', fits: true }];
  for (const key of __ATTACH.REG.keys()) {
    let meta;
    /* модули с регулируемой длиной оцениваем уже подогнанными под слот */
    const opts = (slot.length && __ATTACH.REG.fitsLength(key)) ? { len: slot.length } : {};
    try { meta = __ATTACH.REG.meta(key, opts); } catch (e) { continue; }
    const face = __ATTACH.SYS.slotFace(slot);
    const wants = meta.slot === 'optic' && face === 'side' && meta.canBeOffset
      ? 'optic_offset' : meta.slot;
    if (accepts.indexOf(wants) < 0) continue;
    const fit = __ATTACH.SYS.checkFit(slot, Object.assign({ key }, meta),
      { caliber: ATTACH_DEF.caliber }, {});
    if (!fit.ok) continue;                    // несовместимое просто не предлагаем
    out.push({ key, label: meta.name, short: meta.short, fits: true });
  }
  return out;
}

/* Слоты: статические из описания + динамические от цевья. */
function attachSlots() {
  const base = ATTACH_DEF.slots.slice();
  if (ATTACH_STATE.asm && ATTACH_STATE.asm.slotsDynamic)
    for (const d of ATTACH_STATE.asm.slotsDynamic)
      if (!base.some((b) => b.key === d.key)) base.push(d);
  return base;
}

function attachNameOf(key) {
  try { return __ATTACH.REG.meta(key).name; } catch (e) { return String(key); }
}

/* Пересборка: снять старую группу, собрать новую, вернуть узлы. */
function attachRebuild(THREE, parent, baseParts, weaponNodes) {
  if (ATTACH_STATE.view) {
    parent.remove(ATTACH_STATE.view.root);
    ATTACH_STATE.view.dispose();
  }
  const weapon = {
    caliber: ATTACH_DEF.caliber, weight: ATTACH_DEF.weight,
    ballistics: ATTACH_DEF.ballistics, stats: {},
    base: baseParts || [], nodes: weaponNodes || {}, slots: attachSlots()
  };
  const asm = __ATTACH.SYS.assemble(weapon, __ATTACH.REG, ATTACH_STATE.config);
  const view = __ATTACH.ADAPTER.build(THREE, asm, { scale: 0.001 });
  parent.add(view.root);
  ATTACH_STATE.asm = asm;
  ATTACH_STATE.view = view;
  /* вернуть прежние состояния переключателей */
  view.setBeam('light', ATTACH_STATE.toggles.light);
  view.setBeam('laser', ATTACH_STATE.toggles.laser);
  view.setBeam('ir', ATTACH_STATE.toggles.ir);
  for (const k in ATTACH_STATE.toggles.deploy) view.setDeploy(k, ATTACH_STATE.toggles.deploy[k]);
  return asm;
}

/* Скрытие заменяемых деталей базовой модели: зоны включаются по конфигурации.
   Вызывается после каждой пересборки, поэтому снятие модуля возвращает
   исходную деталь на место. */
function attachOcclude(THREE, host) {
  if (!host) return null;
  return __ATTACH.OCC.apply(THREE, host, "akm", ATTACH_STATE.config, {
    names: ATTACH_HIDE_BY_NAME, groups: {}
  });
}

/* Публичный API: смена модулей из консоли, автотестов и внешнего интерфейса.
   Реальная функция подстановки регистрируется интеграцией оружия. */
window.ATTACH = {
  set(slotKey, moduleKey) {
    if (!ATTACH_STATE.apply) throw new Error('система ещё не готова');
    ATTACH_STATE.apply(slotKey, moduleKey);
    return window.__ATTACH_DEBUG();
  },
  get: () => Object.assign({}, ATTACH_STATE.config),
  slots: () => attachSlots().map((s) => s.key),
  options: (slotKey) => attachOptionsFor(slotKey),
  preset: {
    save: () => __ATTACH.SYS.presetCodec().encode(ATTACH_STATE.config),
    load(code) {
      const cfg = __ATTACH.SYS.presetCodec().decode(code);
      /* Слоты-потомки (планки цевья и кронштейна) появляются только после
         установки носителя, поэтому список слотов перечитывается на каждом
         шаге, а проход повторяется, пока не перестанут возникать новые. */
      const done = {};
      for (let pass = 0; pass < 4; pass++) {
        const keys = attachSlots().map((s) => s.key);
        let changed = false;
        for (const k of keys) {
          if (done[k]) continue;
          done[k] = true;
          changed = true;
          window.ATTACH.set(k, cfg[k] || null);
        }
        if (!changed) break;
      }
      return window.__ATTACH_DEBUG();
    }
  },
  beam: (kind, level) => ATTACH_STATE.view.setBeam(kind, level),
  deploy: (slotKey, t) => ATTACH_STATE.view.setDeploy(slotKey, t),
  stats: () => (ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {})
};

/* Отладочный хук: состояние сборки доступно из консоли и автотестов. */
window.__ATTACH_DEBUG = () => ({
  weapon: "akm",
  config: ATTACH_STATE.config,
  modules: ATTACH_STATE.asm ? Object.keys(ATTACH_STATE.asm.modules) : [],
  parts: ATTACH_STATE.asm ? ATTACH_STATE.asm.parts.length : 0,
  errors: ATTACH_STATE.asm ? ATTACH_STATE.asm.errors : [],
  warnings: ATTACH_STATE.asm ? ATTACH_STATE.asm.warnings : [],
  stats: ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {}
});

/* Управление с клавиатуры: TAB — панель, цифры — слот, стрелки — перебор. */

/* Есть ли на оружии прибор, который умеет светить/давать луч нужного типа.
   Физика простая: включать можно только то, что установлено. Клавиша не
   доставляет приборы «из воздуха» — она лишь щёлкает выключателем. */
function attachHasEmitter(kind) {
  const asm = ATTACH_STATE.asm;
  if (!asm) return false;
  for (const e of asm.emitters || []) {
    if (kind === 'light' && e.type === 'light') return true;
    if (kind === 'laser' && e.type === 'laser') return true;
    if (kind === 'ir' && e.type === 'ir') return true;
  }
  return false;
}

/* Короткое сообщение в панели: почему клавиша «не сработала». */
function attachNotify(text) {
  if (ATTACH_STATE.ui && ATTACH_STATE.ui.notify) ATTACH_STATE.ui.notify(text);
}

const BEAM_NAME = { light: 'фонарь', laser: 'ЛЦУ', ir: 'ИК-луч' };

function attachToggleBeam(kind) {
  if (!ATTACH_STATE.view) return;
  if (!attachHasEmitter(kind)) {
    /* прибора нет — гасим возможный остаточный флаг и сообщаем стрелку */
    ATTACH_STATE.toggles[kind] = 0;
    ATTACH_STATE.view.setBeam(kind, 0);
    attachNotify('Не установлен ' + (BEAM_NAME[kind] || kind) + ' — повесьте прибор на планку');
    return;
  }
  ATTACH_STATE.toggles[kind] = ATTACH_STATE.toggles[kind] ? 0 : 1;
  ATTACH_STATE.view.setBeam(kind, ATTACH_STATE.toggles[kind]);
}

/* После каждой пересборки: снятый прибор уносит с собой своё свечение. */
function attachSyncBeams() {
  for (const kind of ['light', 'laser', 'ir']) {
    if (!attachHasEmitter(kind)) ATTACH_STATE.toggles[kind] = 0;
    if (ATTACH_STATE.view) ATTACH_STATE.view.setBeam(kind, ATTACH_STATE.toggles[kind]);
  }
}

/* Складные узлы (сошки, приклад, магнифер) — то же правило: состояние
   живёт ровно столько, сколько стоит сам модуль. */
function attachSyncDeploy() {
  const asm = ATTACH_STATE.asm;
  const dep = ATTACH_STATE.toggles.deploy;
  for (const k in dep) if (!asm || !asm.modules[k]) delete dep[k];
  if (!ATTACH_STATE.view) return;
  for (const k in dep) ATTACH_STATE.view.setDeploy(k, dep[k]);
}

/* Модули, у которых есть подвижная часть. */
function attachFoldables() {
  const asm = ATTACH_STATE.asm;
  if (!asm) return [];
  return Object.keys(asm.modules).filter((sk) => {
    const m = asm.modules[sk].meta;
    return !!(m.deploy || m.fold || m.flipAxis || m.foldAxis);
  });
}

function attachBindKeys(onChange) {
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const ui = ATTACH_STATE.ui;
    if (e.code === 'Tab') { e.preventDefault(); if (ui) ui.toggle(!ui.visible()); return; }
    if (e.code === 'KeyC') { attachToggleBeam('light'); return; }
    if (e.code === 'KeyZ') { attachToggleBeam('laser'); return; }
    if (e.code === 'KeyX') { if (typeof window.__cycleFireMode === 'function') window.__cycleFireMode(); return; }
    if (e.code === 'KeyB') {
      const list = attachFoldables();
      if (!list.length) { attachNotify('Складывать нечего: сошки и складной приклад не установлены'); return; }
      for (const sk of list) {
        const cur = ATTACH_STATE.toggles.deploy[sk] || 0;
        const next = cur > 0.5 ? 0 : 1;
        ATTACH_STATE.toggles.deploy[sk] = next;
        ATTACH_STATE.view.setDeploy(sk, next);
      }
      return;
    }
    if (!ui || !ui.visible()) return;
    const slots = attachSlots();
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= slots.length) { ui.setActive(slots[n - 1].key); return; }
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
      const act = ui.getActive();
      if (!act) return;
      e.preventDefault();
      const opts = attachOptionsFor(act).filter((o) => o.fits);
      const cur = ATTACH_STATE.config[act] || null;
      let i = opts.findIndex((o) => o.key === cur);
      if (i < 0) i = 0;
      i = (i + (e.code === 'ArrowRight' ? 1 : opts.length - 1)) % opts.length;
      onChange(act, opts[i].key);
      ui.render();
    }
  });
}



function buildAKM(THREE, opts = {}) {
	const mm = (v) => v / 1000                  // все размеры пишем в мм
	const B = mm(75)                            // ось канала ствола: 75 мм над origin
	const RAD = Math.PI / 180
	const group = new THREE.Group()
	group.name = 'AKM'

	// ---------- материалы ----------
	const mats = {
		blued:      new THREE.MeshStandardMaterial({ color: 0x23262a, metalness: 0.85, roughness: 0.42 }),
		parkerized: new THREE.MeshStandardMaterial({ color: 0x2a2d30, metalness: 0.72, roughness: 0.60 }),
		wood:       new THREE.MeshStandardMaterial({ color: 0x6b4423, metalness: 0.00, roughness: 0.62 }),
		woodEdge:   new THREE.MeshStandardMaterial({ color: 0x7d5430, metalness: 0.00, roughness: 0.50 }),
		steelDark:  new THREE.MeshStandardMaterial({ color: 0x17191c, metalness: 0.55, roughness: 0.58 }),
		brass:      new THREE.MeshStandardMaterial({ color: 0xb08d3f, metalness: 0.90, roughness: 0.30 }),
		rubber:     new THREE.MeshStandardMaterial({ color: 0x121314, metalness: 0.00, roughness: 0.90 })
	}
	const WOOD = [mats.woodEdge, mats.wood]     // торцы чуть светлее — потёртый лак

	// ---------- служебные функции ----------
	const geoms = []
	const track = (g) => { geoms.push(g); return g }

	function put(parent, geo, mat, name) {
		const m = new THREE.Mesh(geo, mat)
		m.castShadow = true
		m.receiveShadow = true
		if (name) m.name = name
		parent.add(m)
		return m
	}

	// скруглённый прямоугольник как Shape
	function rrect(w, h, r, cx = 0, cy = 0) {
		const s = new THREE.Shape()
		r = Math.min(r, w / 2 - 1e-6, h / 2 - 1e-6)
		if (r < 1e-5) r = 1e-5
		const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2
		s.moveTo(x0 + r, y0)
		s.lineTo(x1 - r, y0)
		s.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false)
		s.lineTo(x1, y1 - r)
		s.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false)
		s.lineTo(x0 + r, y1)
		s.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false)
		s.lineTo(x0, y0 + r)
		s.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5, false)
		return s
	}
	function holeCircle(r, cx, cy) { const p = new THREE.Path(); p.absarc(cx, cy, r, 0, Math.PI * 2, false); return p }
	function holeOval(w, h, cx, cy) { const p = new THREE.Path(); p.absellipse(cx, cy, w / 2, h / 2, 0, Math.PI * 2, false, 0); return p }
	function holeRect(w, h, r, cx, cy) { return rrect(w, h, r, cx, cy) }

	// профиль в плоскости (Z,Y) -> выдавливание по X, толщина t, центр слоя xc
	function slabX(shape, t, xc, o) {
		o = o || {}
		const g = new THREE.ExtrudeGeometry(shape, {
			depth: t, steps: 1, curveSegments: o.cs || 12,
			bevelEnabled: o.bevel !== false,
			bevelThickness: o.bt !== undefined ? o.bt : mm(0.4),
			bevelSize: o.bs !== undefined ? o.bs : mm(0.4),
			bevelOffset: 0, bevelSegments: o.sg !== undefined ? o.sg : 3
		})
		g.rotateY(-Math.PI / 2)                   // локальный X -> мировой Z
		g.translate(xc + t / 2, 0, 0)
		return track(g)
	}

	// сечение в плоскости (X,Y) -> выдавливание по Z между z0 и z1
	function slabZ(shape, z0, z1, o) {
		o = o || {}
		const g = new THREE.ExtrudeGeometry(shape, {
			depth: Math.abs(z1 - z0), steps: 1, curveSegments: o.cs || 12,
			bevelEnabled: o.bevel !== false,
			bevelThickness: o.bt !== undefined ? o.bt : mm(0.4),
			bevelSize: o.bs !== undefined ? o.bs : mm(0.4),
			bevelOffset: 0, bevelSegments: o.sg !== undefined ? o.sg : 3
		})
		g.translate(0, 0, Math.min(z0, z1))
		return track(g)
	}

	// тело вращения вдоль оси Z: профиль [[радиус, отступ вперёд], ...]
	function latheZ(prof, y0, z0, seg) {
		const pts = prof.map((p) => new THREE.Vector2(Math.max(p[0], 1e-5), p[1]))
		const g = new THREE.LatheGeometry(pts, seg || 32)
		g.rotateX(-Math.PI / 2)                   // локальный +Y -> мировой −Z (направление выстрела)
		g.translate(0, y0, z0)
		return track(g)
	}

	// труба со сквозным каналом и фасками на всех кромках
	function tubeZ(ro, ri, len, y0, z0, seg, cham) {
		const c = cham !== undefined ? cham : mm(0.6)
		return latheZ([
			[ro, c], [ro, len - c], [ro - c, len], [ri + c, len],
			[ri, len - c], [ri, c], [ri + c, 0], [ro - c, 0], [ro, c]
		], y0, z0, seg || 48)
	}
	// сплошной стержень с фасками
	function rodZ(r, len, y0, z0, seg, cham) {
		const c = cham !== undefined ? cham : mm(0.5)
		return latheZ([
			[1e-5, 0], [r - c, 0], [r, c], [r, len - c], [r - c, len], [1e-5, len]
		], y0, z0, seg || 32)
	}
	// заклёпка / винт: купол вдоль +Y, потом поворачиваем как надо
	function domeY(d, h, seg) {
		const r = d / 2, pts = [new THREE.Vector2(r, -mm(0.4)), new THREE.Vector2(r, 0)]
		for (let i = 1; i <= 8; i++) { const a = (i / 8) * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(Math.cos(a) * r, 1e-5), Math.sin(a) * h)) }
		return track(new THREE.LatheGeometry(pts, seg || 24))
	}

	// суперэллипс — сечение для лофта (дерево, магазин)
	function superRing(a, b, p, n) {
		const out = []
		for (let i = 0; i < n; i++) {
			const t = (i / n) * Math.PI * 2, ct = Math.cos(t), st = Math.sin(t)
			out.push(new THREE.Vector2(
				a * Math.sign(ct) * Math.pow(Math.abs(ct), 2 / p),
				b * Math.sign(st) * Math.pow(Math.abs(st), 2 / p)))
		}
		return out
	}

	// лофт по кольцам произвольных точек, с торцами и а��то-проверкой нормалей
	function loft(rings) {
		const n = rings[0].length, m = rings.length
		const pos = [], idx = []
		for (let j = 0; j < m; j++) for (let i = 0; i < n; i++) { const p = rings[j][i]; pos.push(p.x, p.y, p.z) }
		for (let j = 0; j < m - 1; j++) for (let i = 0; i < n; i++) {
			const i2 = (i + 1) % n, a = j * n + i, b = j * n + i2, c = (j + 1) * n + i, d = (j + 1) * n + i2
			idx.push(a, c, d, a, d, b)
		}
		const capA = pos.length / 3
		let cx = 0, cy = 0, cz = 0
		for (let i = 0; i < n; i++) { cx += rings[0][i].x; cy += rings[0][i].y; cz += rings[0][i].z }
		pos.push(cx / n, cy / n, cz / n)
		for (let i = 0; i < n; i++) idx.push(capA, (i + 1) % n, i)
		const capB = pos.length / 3
		cx = cy = cz = 0
		for (let i = 0; i < n; i++) { cx += rings[m - 1][i].x; cy += rings[m - 1][i].y; cz += rings[m - 1][i].z }
		pos.push(cx / n, cy / n, cz / n)
		const base = (m - 1) * n
		for (let i = 0; i < n; i++) idx.push(capB, base + i, base + (i + 1) % n)
		let vol = 0
		for (let k = 0; k < idx.length; k += 3) {
			const a = idx[k] * 3, b = idx[k + 1] * 3, c = idx[k + 2] * 3
			vol += pos[a] * (pos[b + 1] * pos[c + 2] - pos[b + 2] * pos[c + 1])
				- pos[a + 1] * (pos[b] * pos[c + 2] - pos[b + 2] * pos[c])
				+ pos[a + 2] * (pos[b] * pos[c + 1] - pos[b + 1] * pos[c])
		}
		if (vol < 0) for (let k = 0; k < idx.length; k += 3) { const t = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = t }
		const g = new THREE.BufferGeometry()
		g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
		g.setIndex(idx)
		g.computeVertexNormals()
		return track(g)
	}

	function stampY(shapes, h) {

			depth: h, steps: 1, curveSegments: 2, bevelEnabled: true,
			bevelThickness: h * 0.35, bevelSize: h * 0.3, bevelOffset: 0, bevelSegments: 1
		})

	// замкнутая оболочка по кольцам без торцов (последнее кольцо сшивается с первым)
	function shell(rings) {
		const n = rings[0].length, m = rings.length, pos = [], idx = []
		for (let j = 0; j < m; j++) for (let i = 0; i < n; i++) { const p = rings[j][i]; pos.push(p.x, p.y, p.z) }
		for (let j = 0; j < m; j++) {
			const j2 = (j + 1) % m
			for (let i = 0; i < n; i++) {
				const i2 = (i + 1) % n
				idx.push(j * n + i, j2 * n + i, j2 * n + i2, j * n + i, j2 * n + i2, j * n + i2)
			}
		}
		let vol = 0
		for (let k = 0; k < idx.length; k += 3) {
			const a = idx[k] * 3, b = idx[k + 1] * 3, c = idx[k + 2] * 3
			vol += pos[a] * (pos[b + 1] * pos[c + 2] - pos[b + 2] * pos[c + 1])
				- pos[a + 1] * (pos[b] * pos[c + 2] - pos[b + 2] * pos[c])
				+ pos[a + 2] * (pos[b] * pos[c + 1] - pos[b + 1] * pos[c])
		}
		if (vol < 0) for (let k = 0; k < idx.length; k += 3) { const t = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = t }
		const g = new THREE.BufferGeometry()
		g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
		g.setIndex(idx)
		g.computeVertexNormals()
		return track(g)
	}

		const fov = camState.fovFree + (camState.fovAds - camState.fovFree) * e

	// ---------- дульная вспышка ----------
	function starTexture() {
		const c = document.createElement('canvas')
		c.width = c.height = 256
		const x = c.getContext('2d')
		x.globalCompositeOperation = 'lighter'
		const g = x.createRadialGradient(128, 128, 0, 128, 128, 88)
		g.addColorStop(0, 'rgba(255,252,235,1)')
		g.addColorStop(0.10, 'rgba(255,231,160,0.92)')
		g.addColorStop(0.30, 'rgba(255,158,48,0.42)')
		g.addColorStop(0.65, 'rgba(255,96,10,0.12)')
		g.addColorStop(1, 'rgba(255,80,0,0)')
		x.fillStyle = g
		x.beginPath(); x.arc(128, 128, 88, 0, Math.PI * 2); x.fill()
		x.translate(128, 128)
		for (let i = 0; i < 11; i++) {
			const a = i / 11 * Math.PI * 2 + 0.2
			const len = 124 * (i % 2 ? 0.42 : 1) * (0.72 + ((i * 37) % 13) / 13 * 0.45)
			const w = 9 * (i % 2 ? 0.6 : 1)
			const lg = x.createLinearGradient(0, 0, len, 0)
			lg.addColorStop(0, 'rgba(255,240,190,0.95)')
			lg.addColorStop(0.35, 'rgba(255,170,60,0.35)')
			lg.addColorStop(1, 'rgba(255,110,0,0)')
			x.save(); x.rotate(a); x.fillStyle = lg
			x.beginPath(); x.moveTo(0, -w); x.lineTo(len, 0); x.lineTo(0, w); x.closePath(); x.fill(); x.restore()
		}
		const t = new THREE.CanvasTexture(c)
		t.colorSpace = THREE.SRGBColorSpace
		return t
	}

	// ---------- гильзы 7,62×39 ----------
	const casePts = []
	{
		const P = [[0.0001, 0], [5.67, 0], [5.67, 2], [5.2, 3.4], [5.2, 21], [4.35, 29.5], [4.32, 39],
		[3.85, 39], [3.88, 30], [4.7, 21.5], [4.7, 4], [0.0001, 4]]
		for (const p of P) casePts.push(new THREE.Vector2(p[0] / 1000, (p[1] - 19.5) / 1000))
	}
	const caseGeo = new THREE.LatheGeometry(casePts, 32)
	const caseMat = new THREE.MeshStandardMaterial({ color: 0xb08d3f, metalness: 0.9, roughness: 0.3 })
	const cases = []
	const _wp = new THREE.Vector3(), _wq = new THREE.Quaternion()
	function spawnCase() {
		let c = null
		for (const o of cases) if (!o.alive) { c = o; break }
		if (!c) {
			if (cases.length >= 26) return
			c = { mesh: new THREE.Mesh(caseGeo, caseMat), v: new THREE.Vector3(), w: new THREE.Vector3(), t: 0, alive: false }
			c.mesh.castShadow = true
			scene.add(c.mesh)
			cases.push(c)
		}
		nodes.eject.getWorldPosition(_wp)
		nodes.ejectDir.getWorldQuaternion(_wq)
		const d = new THREE.Vector3(0, 0, -1).applyQuaternion(_wq)
		c.mesh.position.copy(_wp)
		c.mesh.quaternion.copy(_wq)
		c.mesh.rotateX(Math.PI / 2)
		c.v.copy(d).multiplyScalar(3.1 + Math.random() * 0.7)
		c.v.x += (Math.random() - 0.5) * 0.5
		c.v.y += (Math.random() - 0.5) * 0.5
		c.w.set((Math.random() - 0.5) * 34, (Math.random() - 0.5) * 26, (Math.random() - 0.5) * 30)
		c.t = 0
		c.alive = true
		c.mesh.visible = true
		sndCasing()
	}

	// ---------- ЗВУК: Web Audio API, процедурно ----------
	let actx = null, master = null, comp = null, echoIn = null, noiseBuf = null
	let muted = false
	function audio() {
		if (actx) { if (actx.state === 'suspended') actx.resume(); return actx }
		const AC = window.AudioContext || window.webkitAudioContext
		if (!AC) return null
		actx = new AC()
		master = actx.createGain()
		master.gain.value = muted ? 0 : 0.8
		comp = actx.createDynamicsCompressor()
		comp.threshold.value = -18
		comp.ratio.value = 8
		comp.knee.value = 8
		comp.attack.value = 0.002
		comp.release.value = 0.14
		comp.connect(master)
		master.connect(actx.destination)
		const sr = actx.sampleRate
		noiseBuf = actx.createBuffer(1, Math.floor(sr * 1.6), sr)
		const nd = noiseBuf.getChannelData(0)
		for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1
		// процедурный импульс 1.2 с с экспонентой и ранними отражениями
		const L = Math.floor(sr * 1.2)
		const ir = actx.createBuffer(2, L, sr)
		for (let ch = 0; ch < 2; ch++) {
			const a = ir.getChannelData(ch)
			for (let i = 0; i < L; i++) {
				const t = i / sr
				a[i] = (Math.random() * 2 - 1) * Math.exp(-t * 3.4) * Math.pow(1 - i / L, 1.6)
			}
			const refl = [[0.029, 0.62], [0.047, 0.44], [0.083, 0.27]]
			for (const r of refl) {
				const k = Math.floor(r[0] * sr * (1 + ch * 0.06))
				if (k < L) { a[k] += r[1]; a[k + 1] -= r[1] * 0.5 }
			}
		}
		const conv = actx.createConvolver()
		conv.buffer = ir
		echoIn = actx.createGain()
		echoIn.gain.value = 0.25
		echoIn.connect(conv)
		conv.connect(comp)
		return actx
	}
	function noiseSrc(t, dur, rate) {
		const s = actx.createBufferSource()
		s.buffer = noiseBuf
		s.loop = true
		s.playbackRate.value = rate || 1
		s.start(t, Math.random() * 1.2)
		s.stop(t + dur)
		return s
	}
	function env(g, t, peak, atk, dur, curve) {
		g.gain.setValueAtTime(0.0001, t)
		g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + atk)
		g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
		if (curve) g.gain.setValueAtTime(0.0001, t + dur + 0.001)
	}
	function sndShot() {
		if (!audio()) return
		const t = actx.currentTime + 0.002
		const p = 1 + (Math.random() * 2 - 1) * 0.04   // питч ±4 %
		const v = 1 + (Math.random() * 2 - 1) * 0.08   // громкос��ь ±8 %
		const tl = 1 + (Math.random() * 2 - 1) * 0.10  // длина хвоста ±10 %
		// 1) крэк: белый шум 8 мс через bandpass 3–6 кГц
		const bp = actx.createBiquadFilter()
		bp.type = 'bandpass'
		bp.frequency.value = 4400 * p
		bp.Q.value = 1.45
		const g1 = actx.createGain()
		noiseSrc(t, 0.03, p).connect(bp)
		bp.connect(g1)
		g1.connect(comp)
		env(g1, t, 0.95 * v, 0.0005, 0.008)
		// 2) тело: шум 260 мс, lowpass 6000 → 300 Гц
		const lp = actx.createBiquadFilter()
		lp.type = 'lowpass'
		lp.Q.value = 1.2
		lp.frequency.setValueAtTime(6000 * p, t)
		lp.frequency.exponentialRampToValueAtTime(300 * p, t + 0.26)
		const g2 = actx.createGain()
		noiseSrc(t, 0.28, p).connect(lp)
		lp.connect(g2)
		g2.connect(comp)
		g2.connect(echoIn)
		env(g2, t, 0.8 * v, 0.003, 0.26)
		// 3) низ: синус 150 → 42 Гц за 90 мс — калибр 7,62
		const o = actx.createOscillator()
		o.type = 'sine'
		o.frequency.setValueAtTime(150 * p, t)
		o.frequency.exponentialRampToValueAtTime(42 * p, t + 0.09)
		const g3 = actx.createGain()
		o.connect(g3)
		g3.connect(comp)
		env(g3, t, 1.0 * v, 0.004, 0.2)
		o.start(t)
		o.stop(t + 0.24)
		// 4) хвост через свёртку
		const g4 = actx.createGain()
		const hp4 = actx.createBiquadFilter()
		hp4.type = 'highpass'
		hp4.frequency.value = 220
		noiseSrc(t, 0.2 * tl, p).connect(hp4)
		hp4.connect(g4)
		g4.connect(echoIn)
		env(g4, t, 0.9 * v, 0.003, 0.19 * tl)
	}
	function sndClack() {
		if (!audio()) return
		const t0 = actx.currentTime + 0.002
		const mk = (t, dur, lvl) => {
			const hp = actx.createBiquadFilter()
			hp.type = 'highpass'
			hp.frequency.value = 2000
			const g = actx.createGain()
			noiseSrc(t, dur + 0.01, 1).connect(hp)
			hp.connect(g)
			g.connect(comp)
			g.connect(echoIn)
			env(g, t, lvl, 0.0006, dur)
		}
		mk(t0, 0.012, 0.5)
		mk(t0 + 0.04, 0.018, 0.3)
	}
	/* Гильза о бетон: три коротких удара латуни. Чистые синусы давали
	   «колокольчик», поэтому тон здесь — узкополосный шум с быстрым
	   затуханием, без тянущейся ноты. */
	function sndCasing() {
		if (!audio()) return
		const t = actx.currentTime + 0.22 + Math.random() * 0.22
		for (let i = 0; i < 3; i++) {
			const tt = t + i * (0.055 + Math.random() * 0.05)
			const lvl = (0.085 - i * 0.026) * (0.8 + Math.random() * 0.4)
			if (lvl <= 0.004) continue
			const bp = actx.createBiquadFilter()
			bp.type = 'bandpass'
			bp.frequency.value = 3000 + Math.random() * 2600
			bp.Q.value = 5.5
			const hp = actx.createBiquadFilter()
			hp.type = 'highpass'
			hp.frequency.value = 1800
			const g = actx.createGain()
			noiseSrc(tt, 0.05, 1).connect(bp)
			bp.connect(hp)
			hp.connect(g)
			g.connect(comp)
			g.connect(echoIn)
			env(g, tt, lvl, 0.0005, 0.032)
		}
	}
	function sndLatch() {
		if (!audio()) return
		const t = actx.currentTime + 0.002
		const hp = actx.createBiquadFilter()
		hp.type = 'highpass'
		hp.frequency.value = 2600
		const g = actx.createGain()
		noiseSrc(t, 0.02, 1).connect(hp)
		hp.connect(g)
		g.connect(comp)
		env(g, t, 0.42, 0.0005, 0.009)
	}
	function sndMagIn() {
		if (!audio()) return
		const t = actx.currentTime + 0.002
		const lp = actx.createBiquadFilter()
		lp.type = 'lowpass'
		lp.frequency.value = 520
		const g = actx.createGain()
		noiseSrc(t, 0.14, 1).connect(lp)
		lp.connect(g)
		g.connect(comp)
		g.connect(echoIn)
		env(g, t, 0.7, 0.002, 0.12)
		const o = actx.createOscillator()
		o.type = 'sine'
		o.frequency.setValueAtTime(190, t)
		o.frequency.exponentialRampToValueAtTime(70, t + 0.08)
		const g2 = actx.createGain()
		o.connect(g2)
		g2.connect(comp)
		env(g2, t, 0.5, 0.003, 0.1)
		o.start(t)
		o.stop(t + 0.14)
	}
	function sndDry() {
		if (!audio()) return
		const t = actx.currentTime + 0.002
		const hp = actx.createBiquadFilter()
		hp.type = 'highpass'
		hp.frequency.value = 3200
		const g = actx.createGain()
		noiseSrc(t, 0.016, 1).connect(hp)
		hp.connect(g)
		g.connect(comp)
		env(g, t, 0.55, 0.0004, 0.007)
	}

	// ---------- состояние и анимация ----------
	const RELOAD_MS = 2600
	const S = { ammo: 30, held: false, lastShot: -1e9, shot: -1e9, reload: -1e9, dry: false, stage: 9,
		mode: 'auto', semiLatch: false }
	/* Переводчик огня АКМ: предохранитель — автоматический — одиночный. */
	const MODE_ORDER = ['safe', 'auto', 'semi']
	const MODE_NAME = { safe: 'ПРЕДОХР', auto: 'АВТО', semi: 'ОДИНОЧНЫЙ' }
	let shakeAmp = 0
	let trig = 0
	const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v)
	const ss = (v) => v * v * (3 - 2 * v)

	function doShot(now) {
		S.ammo--
		S.shot = now
		flash.visible = true
		flash.rotation.z = Math.random() * Math.PI * 2
		const sc = 0.155 * (0.8 + Math.random() * 0.5)   // масштаб 0.8–1.3
		flash.scale.set(sc, sc, sc)
		mLight.intensity = 11
		spawnCase()
		sndShot()
		shakeAmp = 0.0028                                // дрожь камеры 2–3 мм
	}
	function tryShot(now) {
		if (now - S.reload < RELOAD_MS) return
		if (S.mode === 'safe') { if (!S.dry) { sndDry(); S.dry = true } return }
		if (S.mode === 'semi' && S.semiLatch) return
		if (now - S.lastShot < 100) return               // 600 выстрелов в минуту
		if (S.ammo <= 0) {
			if (!S.dry) { sndDry(); S.dry = true }
			return
		}
		S.lastShot = (now - S.lastShot > 260) ? now : S.lastShot + 100
		doShot(now)
		if (S.mode === 'semi') S.semiLatch = true
	}
	function startReload(now) {
		if (now - S.reload < RELOAD_MS) return
		S.reload = now
		S.stage = 0
		sndLatch()
	}

	// ---------- кнопки ----------
	const btnFire = document.getElementById('fire')
	const btnReload = document.getElementById('reload')
	const btnMute = document.getElementById('mute')
	const btnMode = document.getElementById('mode')
	function syncMode() {
		if (btnMode) {
			btnMode.textContent = MODE_NAME[S.mode]
			btnMode.classList.toggle('on', S.mode !== 'safe')
		}
	}
	function cycleMode() {
		S.mode = MODE_ORDER[(MODE_ORDER.indexOf(S.mode) + 1) % MODE_ORDER.length]
		S.semiLatch = false
		sndLatch()
		syncMode()
	}
	window.__cycleFireMode = cycleMode
	if (btnMode) btnMode.addEventListener('click', () => { audio(); cycleMode() })
	syncMode()
	const holdOn = (ev) => {
		if (ev) ev.preventDefault()
		audio()
		S.held = true
		S.dry = false
		btnFire.classList.add('on')
		tryShot(performance.now())
	}
	const holdOff = () => {
		S.held = false
		S.semiLatch = false
		btnFire.classList.remove('on')
	}
	btnFire.addEventListener('pointerdown', holdOn)
	btnFire.addEventListener('pointerup', holdOff)
	btnFire.addEventListener('pointercancel', holdOff)
	btnFire.addEventListener('pointerleave', holdOff)
	btnFire.addEventListener('contextmenu', (e) => e.preventDefault())
	btnReload.addEventListener('pointerdown', (e) => {
		e.preventDefault()
		audio()
		btnReload.classList.add('on')
		startReload(performance.now())
	})
	btnReload.addEventListener('pointerup', () => btnReload.classList.remove('on'))
	btnReload.addEventListener('pointerleave', () => btnReload.classList.remove('on'))
	btnMute.addEventListener('click', () => {
		muted = !muted
		if (master) master.gain.value = muted ? 0 : 0.8
		document.getElementById('w1').style.display = muted ? 'none' : ''
		document.getElementById('w2').style.display = muted ? 'none' : ''
		document.getElementById('w3').style.display = muted ? '' : 'none'
		btnMute.style.color = muted ? '#71777e' : ''
	})
	window.addEventListener('keydown', (e) => {
		if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) holdOn(null) }
		else if (e.code === 'KeyR') { audio(); startReload(performance.now()) }
		else if (e.code === 'KeyF') { e.preventDefault(); if (!e.repeat) setAds(!camState.ads) }
	})
	window.addEventListener('keyup', (e) => {
		if (e.code === 'Space') { e.preventDefault(); holdOff() }
	})
	window.addEventListener('pointerdown', () => audio(), { passive: true })
	window.addEventListener('blur', holdOff)

	// ---------- цик�� ----------
	const shake = new THREE.Vector3()
	let prev = performance.now()
	let broken = false
	function frame(now) {
		const dt = Math.min(0.05, (now - prev) / 1000)
		prev = now

		if (S.held) tryShot(now)

		// отдача считается от ИСХОДНОЙ позы, а не от текущей
		let posZ = 0, rotX = 0, rotZ = 0, rotY = 0, boltZ = 0
		const es = now - S.shot
		if (es >= 0 && es <= 100) {
			const k = es <= 35 ? es / 35 : Math.pow(1 - (es - 35) / 65, 3)
			posZ = 0.016 * k                              // уход назад на 16 мм
			rotX = 2.2 * RAD * k                          // подброс на 2.2°
			boltZ = es <= 55 ? 0.110 * (es / 55) : 0.110 * (1 - (es - 55) / 45)
		}
		if (flash.visible && es > 35) flash.visible = false
		mLight.intensity = Math.max(0, mLight.intensity - dt * 330)

		// перезарядка 2.6 с
		const er = now - S.reload
		let magVis = true
		const mag = parts.magazine
		if (er >= 0 && er < RELOAD_MS + 40) {
			const roll = ss(clamp01(er / 260)) * (1 - ss(clamp01((er - 2400) / 200)))
			rotZ = -14 * RAD * roll
			rotY = 9 * RAD * roll
			rotX += -2.5 * RAD * roll
			let my = 0, mz = 0, mrx = 0
			if (er < 120) { /* щелчок защёлки и наклон */ }
			else if (er < 380) { const k = ss(clamp01((er - 120) / 260)); my = -0.115 * k; mz = -0.05 * k; mrx = -0.42 * k }
			else if (er < 900) { magVis = false }
			else if (er < 1450) { const k = ss(clamp01((er - 900) / 550)); my = -0.17 * (1 - k); mz = -0.075 * (1 - k); mrx = -0.5 * (1 - k) }
			else if (er < 1560) { my = -0.0035 * Math.sin((er - 1450) / 110 * Math.PI) }   // удар фиксации
			mag.position.set(magBase.x, magBase.y + my, magBase.z + mz)
			mag.rotation.x = mrx
			if (er >= 1900 && er < 2060) boltZ = 0.110 * ss(clamp01((er - 1900) / 160))   // рывок рукоятки
			else if (er >= 2060 && er < 2150) boltZ = 0.110 * (1 - ss(clamp01((er - 2060) / 90)))
			if (S.stage < 1 && er >= 380) { S.stage = 1; sndClack() }
			if (S.stage < 2 && er >= 1440) { S.stage = 2; sndMagIn() }
			if (S.stage < 3 && er >= 1900) { S.stage = 3; sndClack() }
			if (S.stage < 4 && er >= 2400) { S.stage = 4; S.ammo = 30; S.dry = false }
		} else if (S.stage < 9) {
			S.stage = 9
			mag.position.copy(magBase)
			mag.rotation.x = 0
		}
		mag.visible = magVis

		rig.position.z = posZ
		rig.rotation.set(rotX, rotY, rotZ)
		parts.bolt.position.z = boltZ
		parts.charging.position.z = boltZ
		const trigT = (S.held && S.ammo > 0 && now - S.reload > RELOAD_MS) || es < 60 ? 1 : 0
		trig += (trigT - trig) * Math.min(1, dt * 26)
		parts.trigger.rotation.x = 13 * RAD * trig

		// гильзы
		for (const c of cases) {
			if (!c.alive) continue
			c.t += dt
			c.v.y -= 9.81 * dt
			c.mesh.position.addScaledVector(c.v, dt)
			c.mesh.rotateX(c.w.x * dt)
			c.mesh.rotateY(c.w.y * dt)
			c.mesh.rotateZ(c.w.z * dt)
			if (c.t > 1.2) { c.alive = false; c.mesh.visible = false }
		}

		// возврат в стартовый ракурс
		if (tween > 0) {
			const k = ss(clamp01((now - tween) / 620))
			camera.position.lerpVectors(tweenFromP, startPos, k)
			controls.target.lerpVectors(tweenFromT, startTgt, k)
			if (k >= 1) tween = -1
		}
		if (controls.enabled) controls.update()
		updateAds(dt)

		shakeAmp *= Math.exp(-dt * 20)
		if (shakeAmp > 1e-5) {
			shake.set((Math.random() - 0.5) * 2 * shakeAmp, (Math.random() - 0.5) * 2 * shakeAmp, (Math.random() - 0.5) * 2 * shakeAmp)
			camera.position.add(shake)
			renderer.render(scene, camera)
			camera.position.sub(shake)
		} else {
			renderer.render(scene, camera)
		}
	}
	renderer.setAnimationLoop((now) => {
		if (broken) return
		try { frame(now || performance.now()) } catch (e) { broken = true; renderer.setAnimationLoop(null); fail(e) }
	})
} catch (e) {
	fail(e)
}

</script>
