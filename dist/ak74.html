  border:1px solid rgba(255,255,255,.14);border-radius:8px;
  background:rgba(14,16,19,.9);padding:0 14px;cursor:pointer;font-size:12.5px;
  line-height:1;color:#dfe3e8;white-space:nowrap;transition:background .14s,border-color .14s}
.copt:hover{background:rgba(32,36,42,.94)}
.copt.sel{border-color:#e8b45c;color:#ffd79a;background:rgba(232,180,92,.16)}

#custStats{position:fixed;left:18px;top:84px;z-index:20;pointer-events:none;
  width:238px;display:flex;flex-direction:column;gap:2px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
.cstat{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:4px 10px;border-radius:5px;background:rgba(10,12,15,.78);
  border-left:2px solid rgba(255,255,255,.18);font-size:11.5px;line-height:1.35}
.cstat span{color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cstat b{font-weight:600;font-variant-numeric:tabular-nums;color:#f0f2f5;white-space:nowrap}
.cstat.up{border-left-color:#63c97a}
.cstat.up b{color:#96e6a6}
.cstat.dn{border-left-color:#e07a6a}
.cstat.dn b{color:#f0a598}
.cstat i{font-style:normal;font-size:10px;margin-left:5px;opacity:.85}

/* Подсказка и предупреждение — собственные строки фиксированной высоты,
   поэтому появление текста не двигает ряды кнопок. */
#custHint{text-align:center;font-size:11px;line-height:16px;height:16px;
  color:rgba(255,255,255,.38);letter-spacing:.02em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#custWarn{text-align:center;font-size:11.5px;line-height:16px;min-height:16px;
  color:#e8b45c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#custWarn:empty{display:none}
@media (max-width:900px){
  .cslot{width:126px;height:52px}
  .copt{height:34px;padding:0 11px;font-size:12px}
  #custStats{width:190px;top:70px;left:10px}
  #custHint{font-size:10px}
}
`;

  /* Подписи и порядок показа характеристик. up=true — больше значит лучше. */
  const STAT_DEFS = [
    { k: 'vertRecoil', label: 'Подброс', up: false, fmt: (v) => v.toFixed(2) },
    { k: 'horizRecoil', label: 'Увод', up: false, fmt: (v) => v.toFixed(2) },
    { k: 'hipSpread', label: 'Разброс от бедра', up: false, fmt: (v) => v.toFixed(2) },
    { k: 'adsTime', label: 'Вскидка, с', up: false, fmt: (v) => v.toFixed(3) },
    { k: 'mobility', label: 'Подвижность', up: true, fmt: (v) => v.toFixed(0) },
    { k: 'reloadTime', label: 'Перезарядка, с', up: false, fmt: (v) => v.toFixed(2) },
    { k: 'muzzleVelocity', label: 'Скорость, м/с', up: true, fmt: (v) => v.toFixed(0) },
    { k: 'effectiveRange', label: 'Дальность, м', up: true, fmt: (v) => v.toFixed(0) },
    { k: 'loudness', label: 'Громкость', up: false, fmt: (v) => v.toFixed(0) },
    { k: 'flashVisible', label: 'Заметность вспышки', up: false, fmt: (v) => v.toFixed(0) },
    { k: 'weight', label: 'Масса, г', up: false, fmt: (v) => v.toFixed(0) },
    { k: 'magCap', label: 'Ёмкость', up: true, fmt: (v) => v.toFixed(0) }
  ];

  /* Возвращает исходник браузерного модуля интерфейса (строкой). */
  function source() {
    return `
/* --- интерфейс кастомизации (генерируется src/attach/ui.js) --- */
const CUST_CSS = ${JSON.stringify(CSS)};
const STAT_DEFS = ${JSON.stringify(STAT_DEFS.map((s) => ({ k: s.k, label: s.label, up: s.up, d: s.k === 'vertRecoil' || s.k === 'horizRecoil' || s.k === 'hipSpread' ? 2 : (s.k === 'adsTime' || s.k === 'reloadTime' ? 3 : 0) })))};

function createCustomizer(opts) {
  const style = document.createElement('style');
  style.textContent = CUST_CSS;
  document.head.appendChild(style);

  const host = document.createElement('div'); host.id = 'cust';
  const warn = document.createElement('div'); warn.id = 'custWarn';
  const list = document.createElement('div'); list.id = 'custList';
  const slots = document.createElement('div'); slots.id = 'custSlots';
  const hint = document.createElement('div'); hint.id = 'custHint';
  hint.textContent = 'TAB — панель · 1…9 — слот · ← → — модуль · B — сошки/приклад · C — фонарь · Z — ЛЦУ · X — режим огня';
  /* Порядок строк сверху вниз: подсказка, сообщение, модули, слоты. */
  host.append(hint, warn, list, slots);
  document.body.appendChild(host);

  const statBox = document.createElement('div'); statBox.id = 'custStats';
  document.body.appendChild(statBox);

  let active = null, prevStats = null, notice = '', noticeTimer = 0;

  function renderSlots(defs, cfg) {
    slots.innerHTML = '';
    defs.forEach((s, i) => {
      const cur = cfg[s.key];
      const el = document.createElement('div');
      el.className = 'cslot' + (active === s.key ? ' on' : '') + (cur ? '' : ' empty');
      const k = document.createElement('div'); k.className = 'k';
      k.textContent = (i < 9 ? (i + 1) + ' · ' : '') + s.label;
      k.title = s.label;
      const v = document.createElement('div'); v.className = 'v';
      v.textContent = cur ? opts.nameOf(cur) : '—';
      v.title = v.textContent;
      el.append(k, v);
      el.onclick = () => { active = s.key; render(); };
      slots.appendChild(el);
      if (active === s.key) requestAnimationFrame(() => {
        el.scrollIntoView({ block: 'nearest', inline: 'center' });
      });
    });
  }

  function renderOptions(cfg) {
    list.innerHTML = '';
    if (!active) return;
    let selected = null;
    for (const o of opts.optionsFor(active)) {
      const el = document.createElement('div');
      const isSel = (cfg[active] || null) === o.key;
      el.className = 'copt' + (isSel ? ' sel' : '');
      el.textContent = o.label;
      el.title = o.label;
      el.onclick = () => { opts.setModule(active, o.key); render(); };
      list.appendChild(el);
      if (isSel) selected = el;
    }
    if (selected) requestAnimationFrame(() => {
      selected.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  }

  function renderStats() {
    const st = opts.getStats();
    statBox.innerHTML = '';
    for (const d of STAT_DEFS) {
      if (st[d.k] === undefined) continue;
      const v = st[d.k], pv = prevStats ? prevStats[d.k] : undefined;
      const changed = pv !== undefined && Math.abs(v - pv) > 1e-6;
      let cls = 'cstat';
      if (changed) cls += ((v > pv) === d.up) ? ' up' : ' dn';
      const row = document.createElement('div');
      row.className = cls;
      const name = document.createElement('span'); name.textContent = d.label;
      const val = document.createElement('b');
      val.textContent = v.toFixed(d.d);
      if (changed) {
        const diff = document.createElement('i');
        const delta = v - pv;
        diff.textContent = (delta > 0 ? '▲' : '▼') + Math.abs(delta).toFixed(d.d);
        val.appendChild(diff);
      }
      row.append(name, val);
      statBox.appendChild(row);
    }
  }

  function render() {
    const cfg = opts.getConfig(), defs = opts.getSlots();
    if (active && !defs.some((s) => s.key === active)) active = null;
    renderSlots(defs, cfg);
    renderOptions(cfg);
    renderStats();
    const w = opts.getWarnings();
    warn.textContent = notice || (w && w.length ? w.join(' · ') : '');
  }

  return {
    render,
    markStats() { prevStats = Object.assign({}, opts.getStats()); },
    setActive(k) { active = k; render(); },
    getActive() { return active; },
    /* Короткое сообщение поверх предупреждений сборки (гаснет само). */
    notify(text) {
      notice = text || '';
      warn.textContent = notice;
      clearTimeout(noticeTimer);
      if (notice) noticeTimer = setTimeout(() => { notice = ''; render(); }, 2600);
    },
    toggle(on) {
      const show = on !== false;
      host.classList.toggle('hidden', !show);
      statBox.style.display = show ? '' : 'none';
      if (show) render();
    },
    visible() { return !host.classList.contains('hidden'); }
  };
}
`;
  }

  return { CSS, STAT_DEFS, source };
};
});

__def("three_adapter", function (module, exports) {
/* ============================================================================
   Адаптер three.js: превращает сборку системы модулей в Object3D.

   На вход — результат assemble() и палитра материалов (common.MATS).
   На выходе — группа с подгруппами по слотам, узлами-ориентирами,
   лучом фонаря, лазерным лучом и API управления модулями в рантайме.

   Геометрия считается в миллиметрах, сцена — в метрах (масштаб 0.001).
   ========================================================================== */
module.exports = function (G, C) {
  const S = 0.001;

  function build(THREE, asm, opts) {
    const O = Object.assign({ scale: S, shadows: true, envIntensity: 1 }, opts || {});
    const root = new THREE.Group();
    root.name = 'weapon';

    const geos = [], mats = [], matMap = {};
    const glassSet = new Set(asm.glass || []);
    const emisSet = new Set(asm.emissive || []);

    const mkMat = (key, partName) => {
      const isGlass = glassSet.has(partName);
      const isEmis = emisSet.has(partName);
      const id = key + (isGlass ? '|g' : '') + (isEmis ? '|e' : '');
      if (matMap[id]) return matMap[id];
      const d = C.MATS[key] || C.MATS.steel;
      let m;
      if (d.alpha !== undefined && d.alpha < 1) {
        m = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(d.color[0], d.color[1], d.color[2]),
          metalness: d.metal, roughness: d.rough,
          transparent: true, opacity: d.alpha, side: THREE.DoubleSide,
          clearcoat: d.coat || 0, clearcoatRoughness: 0.04, depthWrite: false
        });
      } else {
        m = new THREE.MeshStandardMaterial({
          color: new THREE.Color(d.color[0], d.color[1], d.color[2]),
          metalness: d.metal, roughness: d.rough
        });
      }
      if (d.emis) {
        m.emissive = new THREE.Color(d.emis[0], d.emis[1], d.emis[2]);
        m.emissiveIntensity = 1;
        m.toneMapped = false;
      }
      m.envMapIntensity = O.envIntensity;
      matMap[id] = m; mats.push(m);
      return m;
    };

    const toGeo = (raw) => {
      const n = raw.p.length;
      const pos = new Float32Array(n), nrm = new Float32Array(n);
      for (let i = 0; i < n; i++) { pos[i] = raw.p[i] * O.scale; nrm[i] = raw.n[i]; }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
      g.computeBoundingSphere();
      geos.push(g);
      return g;
    };

    /* группировка: слот + материал, чтобы модуль можно было скрыть целиком */
    const buckets = {}, order = [];
    for (const p of asm.parts) {
      const grp = p.src || 'base';
      const anim = p.group || 'body';
      /* стёкла и эмиссив держим отдельными мешами — им нужен свой материал */
      const solo = glassSet.has(p.name) || emisSet.has(p.name);
      const key = grp + '|' + anim + '|' + p.mat + (solo ? '|' + p.name : '');
      if (!buckets[key]) { buckets[key] = { grp, anim, mat: p.mat, name: p.name, list: [] }; order.push(key); }
      buckets[key].list.push(p.geo);
    }

    const slotGroups = {}, animGroups = {};
    const groupFor = (slot, anim) => {
      if (!slotGroups[slot]) {
        const g = new THREE.Group();
        g.name = 'slot:' + slot;
        /* пометка нужна системе скрытия: детали модулей она не трогает,
           даже если слот живёт в чужой группе (магазин, затвор) */
        g.userData.attachModule = true;
        /* хост может увести слот в свою анимируемую группу (магазин, затвор) */
        let host = O.parentFor && O.parentFor(slot);
        if (host && typeof host.add !== 'function') host = host.group || host.obj || null;
        const parent = (host && typeof host.add === 'function') ? host : root;
        parent.add(g);
        /* Геометрия модуля уже посчитана в координатах оружия, а группа-
           носитель (магазин, затвор) несёт собственное смещение внутри
           оружия. Без компенсации модуль уезжает на это смещение. */
        if (parent !== root && O.hostRoot) {
          const off = new THREE.Vector3();
          for (let o = parent; o && o !== O.hostRoot; o = o.parent) off.add(o.position);
          g.position.copy(off).negate();
        }
        slotGroups[slot] = g;
      }
      const key = slot + '|' + anim;
      if (!animGroups[key]) {
        const g = new THREE.Group();
        g.name = anim;
        g.userData.attachModule = true;
        slotGroups[slot].add(g);
        animGroups[key] = g;
      }
      return animGroups[key];
    };

    const meshByPart = {};
    for (const k of order) {
      const b = buckets[k];
      const mesh = new THREE.Mesh(toGeo(G.merge(b.list)), mkMat(b.mat, b.name));
      mesh.name = k;
      mesh.userData.attachModule = true;
      mesh.castShadow = O.shadows;
      mesh.receiveShadow = O.shadows;
      groupFor(b.grp, b.anim).add(mesh);
      meshByPart[b.name] = mesh;
    }

    /* узлы-ориентиры */
    const nodes = {};
    for (const nk in asm.nodes) {
      const v = asm.nodes[nk];
      if (!Array.isArray(v) || v.length !== 3) continue;
      const o = new THREE.Object3D();
      o.name = nk;
      o.position.set(v[0] * O.scale, v[1] * O.scale, v[2] * O.scale);
      root.add(o);
      nodes[nk] = o;
    }

    /* ---- луч фонаря и лазер как объекты сцены ---- */
    const beams = [];
    for (const e of asm.emitters || []) {
      const anchor = new THREE.Object3D();
      anchor.position.set(e.pos[0] * O.scale, e.pos[1] * O.scale, e.pos[2] * O.scale);
      const d = new THREE.Vector3(e.dir[0], e.dir[1], e.dir[2]);
      anchor.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), d);
      anchor.name = 'emitter:' + e.slot + ':' + e.type;
      root.add(anchor);

      if (e.type === 'light') {
        const spot = new THREE.SpotLight(e.color || 0xfff1dc, 0, 60, e.spillAngle || 0.4, 0.45, 1.2);
        spot.position.set(0, 0, 0);
        spot.target.position.set(0, 0, -20);
        anchor.add(spot, spot.target);
        /* видимый конус рассеяния */
        const cone = new THREE.Mesh(
          new THREE.ConeGeometry(Math.tan(e.spillAngle || 0.4) * 18, 18, 28, 1, true),
          new THREE.MeshBasicMaterial({ color: e.color || 0xfff1dc, transparent: true,
            opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
        );
        cone.rotation.x = Math.PI / 2;
        cone.position.z = -9;
        anchor.add(cone);
        geos.push(cone.geometry); mats.push(cone.material);
        beams.push({ kind: 'light', slot: e.slot, anchor, spot, cone, meta: e, level: 0 });
      } else {
        const len = 80;
        const beam = new THREE.Mesh(
          new THREE.CylinderGeometry((e.beamR || 0.9) * 0.001, (e.beamR || 0.9) * 0.0028, len, 8, 1, true),
          new THREE.MeshBasicMaterial({ color: e.color || 0xff2020, transparent: true,
            opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        beam.rotation.x = -Math.PI / 2;
        beam.position.z = -len / 2;
        anchor.add(beam);
        const dot = new THREE.Sprite(new THREE.SpriteMaterial({ color: e.color || 0xff2020,
          transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
        dot.scale.setScalar(0.02);
        anchor.add(dot);
        geos.push(beam.geometry); mats.push(beam.material, dot.material);
        beams.push({ kind: e.type === 'ir' ? 'ir' : 'laser', slot: e.slot, anchor, beam, dot, meta: e, level: 0 });
      }
    }

    /* ---- API рантайма ---- */
    const api = {
      root, nodes, slots: slotGroups, meshes: meshByPart, beams,
      modules: asm.modules, stats: asm.derived, warnings: asm.warnings, errors: asm.errors,

      /* показать/скрыть модуль слота без пересборки */
      setSlotVisible(slotKey, on) {
        const g = slotGroups[slotKey];
        if (g) g.visible = on !== false;
      },

      /* включение фонаря/лазера: level 0..1 */
      setBeam(kind, level, slotKey) {
        for (const b of beams) {
          if (b.kind !== kind) continue;
          if (slotKey && b.slot !== slotKey) continue;
          b.level = Math.max(0, Math.min(1, level));
          if (b.kind === 'light') {
            b.spot.intensity = b.level * (b.meta.lumens ? b.meta.lumens / 120 : 8);
            b.cone.material.opacity = b.level * 0.10;
          } else {
            const vis = b.kind === 'ir' ? b.level * 0.18 : b.level;
            b.beam.material.opacity = vis * 0.30;
            b.dot.material.opacity = vis * 0.95;
          }
        }
      },

      /* подсветка марки прицела */
      setReticle(on, brightness) {
        for (const r of asm.reticles || []) {
          const m = meshByPart[r.part];
          if (!m) continue;
          m.visible = on !== false;
          if (m.material.emissiveIntensity !== undefined)
            m.material.emissiveIntensity = 0.4 + 3.2 * (brightness === undefined ? 1 : brightness);
        }
      },

      /* складывание/раскладывание подвижных модулей (сошки, приклад, магнифер) */
      setDeploy(slotKey, t) {
        const mod = asm.modules[slotKey];
        if (!mod) return;
        const d = mod.meta.deploy || mod.meta.fold || mod.meta.flipAxis;
        if (!d) return;
        const g = slotGroups[slotKey];
        if (!g) return;
        const a0 = d.foldedAngle !== undefined ? d.foldedAngle : 0;
        const a1 = d.deployedAngle !== undefined ? d.deployedAngle : (d.angle || 0);
        const ang = (a0 + (a1 - a0) * t) * Math.PI / 180;
        /* поворот вокруг оси модуля: пивот задан в мм локально */
        const piv = d.pivot || [0, 0, 0];
        const M = mod.matrix;
        const wp = require_xform(M, piv);
        g.position.set(0, 0, 0); g.rotation.set(0, 0, 0);
        const v = new THREE.Vector3(wp[0] * O.scale, wp[1] * O.scale, wp[2] * O.scale);
        const q = new THREE.Quaternion().setFromAxisAngle(
          d.axis === 'y' ? new THREE.Vector3(0, 1, 0) : d.axis === 'z'
            ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(1, 0, 0), ang);
        g.position.copy(v).applyQuaternion(q).multiplyScalar(-1).add(v);
        g.quaternion.copy(q);
      },

      /* Полное снятие сборки со сцены.
         Важно: группы слотов могут висеть не на root, а в анимируемых ригах
         оружия (магазин, затвор). Если удалять только root, такие группы
         остаются в сцене и новые модули накладываются на старые. */
      dispose() {
        for (const k in slotGroups) {
          const g = slotGroups[k];
          if (g.parent) g.parent.remove(g);
        }
        if (root.parent) root.parent.remove(root);
        for (const b of beams) if (b.anchor && b.anchor.parent) b.anchor.parent.remove(b.anchor);
        for (const g of geos) g.dispose();
        for (const m of mats) m.dispose();
        geos.length = 0; mats.length = 0;
      }
    };

    function require_xform(M, v) {
      return [M[0] * v[0] + M[4] * v[1] + M[8] * v[2] + M[12],
        M[1] * v[0] + M[5] * v[1] + M[9] * v[2] + M[13],
        M[2] * v[0] + M[6] * v[1] + M[10] * v[2] + M[14]];
    }

    api.setReticle(true, 1);
    api.setBeam('light', 0); api.setBeam('laser', 0); api.setBeam('ir', 0);
    return api;
  }

  return { build };
};
});

/* ============================================================================
   Адаптер для «сырых» WebGL-движков (СВД, Remington 870, Glock 18C).

   Эти файлы рисуют индексированные меши собственного формата и не используют
   three.js. Адаптер конвертирует треугольный суп системы модулей в нужный
   формат и отдаёт материалы в терминах конкретного движка.

   Поддерживаемые форматы:
     'pnti' — {p,n,t,e,i}  (СВД): позиция, нормаль, UV, ребро, индексы;
     'pni'  — {p,n,i}      (Glock);
     'posTri' — {pos,nrm,tri} (Remington).
   ========================================================================== */
module.exports = function (G, C) {

  /* Сварка вершин: суп → индексированный меш. Порог 0,02 мм. */
  function weld(raw, fmt) {
    const map = new Map();
    const P = [], N = [], I = [];
    const Q = 50;                                   // 1/0.02 мм
    const n = raw.p.length / 3;
    for (let i = 0; i < n; i++) {
      const x = raw.p[i * 3], y = raw.p[i * 3 + 1], z = raw.p[i * 3 + 2];
      const nx = raw.n[i * 3], ny = raw.n[i * 3 + 1], nz = raw.n[i * 3 + 2];
      /* нормаль входит в ключ: острые рёбра не сглаживаются */
      const k = Math.round(x * Q) + ',' + Math.round(y * Q) + ',' + Math.round(z * Q) + '|' +

  document.head.appendChild(style);

  const host = document.createElement('div'); host.id = 'cust';
  const warn = document.createElement('div'); warn.id = 'custWarn';
  const list = document.createElement('div'); list.id = 'custList';
  const slots = document.createElement('div'); slots.id = 'custSlots';
  const hint = document.createElement('div'); hint.id = 'custHint';
  hint.textContent = 'TAB — панель · 1…9 — слот · ← → — модуль · B — сошки/приклад · C — фонарь · Z — ЛЦУ · X — режим огня';
  /* Порядок строк сверху вниз: подсказка, сообщение, модули, слоты. */
  host.append(hint, warn, list, slots);
  document.body.appendChild(host);

  const statBox = document.createElement('div'); statBox.id = 'custStats';
  document.body.appendChild(statBox);

  let active = null, prevStats = null, notice = '', noticeTimer = 0;

  function renderSlots(defs, cfg) {
    slots.innerHTML = '';
    defs.forEach((s, i) => {
      const cur = cfg[s.key];
      const el = document.createElement('div');
      el.className = 'cslot' + (active === s.key ? ' on' : '') + (cur ? '' : ' empty');
      const k = document.createElement('div'); k.className = 'k';
      k.textContent = (i < 9 ? (i + 1) + ' · ' : '') + s.label;
      k.title = s.label;
      const v = document.createElement('div'); v.className = 'v';
      v.textContent = cur ? opts.nameOf(cur) : '—';
      v.title = v.textContent;
      el.append(k, v);
      el.onclick = () => { active = s.key; render(); };
      slots.appendChild(el);
      if (active === s.key) requestAnimationFrame(() => {
        el.scrollIntoView({ block: 'nearest', inline: 'center' });
      });
    });
  }

  function renderOptions(cfg) {
    list.innerHTML = '';
    if (!active) return;
    let selected = null;
    for (const o of opts.optionsFor(active)) {
      const el = document.createElement('div');
      const isSel = (cfg[active] || null) === o.key;
      el.className = 'copt' + (isSel ? ' sel' : '');
      el.textContent = o.label;
      el.title = o.label;
      el.onclick = () => { opts.setModule(active, o.key); render(); };
      list.appendChild(el);
      if (isSel) selected = el;
    }
    if (selected) requestAnimationFrame(() => {
      selected.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  }

  function renderStats() {
    const st = opts.getStats();
    statBox.innerHTML = '';
    for (const d of STAT_DEFS) {
      if (st[d.k] === undefined) continue;
      const v = st[d.k], pv = prevStats ? prevStats[d.k] : undefined;
      const changed = pv !== undefined && Math.abs(v - pv) > 1e-6;
      let cls = 'cstat';
      if (changed) cls += ((v > pv) === d.up) ? ' up' : ' dn';
      const row = document.createElement('div');
      row.className = cls;
      const name = document.createElement('span'); name.textContent = d.label;
      const val = document.createElement('b');
      val.textContent = v.toFixed(d.d);
      if (changed) {
        const diff = document.createElement('i');
        const delta = v - pv;
        diff.textContent = (delta > 0 ? '▲' : '▼') + Math.abs(delta).toFixed(d.d);
        val.appendChild(diff);
      }
      row.append(name, val);
      statBox.appendChild(row);
    }
  }

  function render() {
    const cfg = opts.getConfig(), defs = opts.getSlots();
    if (active && !defs.some((s) => s.key === active)) active = null;
    renderSlots(defs, cfg);
    renderOptions(cfg);
    renderStats();
    const w = opts.getWarnings();
    warn.textContent = notice || (w && w.length ? w.join(' · ') : '');
  }

  return {
    render,
    markStats() { prevStats = Object.assign({}, opts.getStats()); },
    setActive(k) { active = k; render(); },
    getActive() { return active; },
    /* Короткое сообщение поверх предупреждений сборки (гаснет само). */
    notify(text) {
      notice = text || '';
      warn.textContent = notice;
      clearTimeout(noticeTimer);
      if (notice) noticeTimer = setTimeout(() => { notice = ''; render(); }, 2600);
    },
    toggle(on) {
      const show = on !== false;
      host.classList.toggle('hidden', !show);
      statBox.style.display = show ? '' : 'none';
      if (show) render();
    },
    visible() { return !host.classList.contains('hidden'); }
  };
}


/* ---- интеграция кастомизации (шаблон, подставляется tools/build.js) ---- */
const ATTACH_DEF = __ATTACH.SLOTS["ak74"];
const ATTACH_STATE = {
  config: Object.assign({}, ATTACH_DEF.defaults),
  asm: null, view: null, ui: null,
  toggles: { light: 0, laser: 0, ir: 0, deploy: {} }
};
/* деталь базовой модели -> слот, который её заменяет (для точечного скрытия) */
const ATTACH_HIDE_BY_NAME = {"muzzleBrake":"muzzle","handguardLower":"handguard","hgFerrule":"handguard","handguardUpper":"handguard","hgFerruleUp":"handguard","stock":"stock","buttPlate":"stock","buttTrap":"stock","slingLoop":"stock","magBody":"mag","magLugFront":"mag","magLugRear":"mag","magMouth":"mag","magTopRound":"mag","dustCover":"mount"};

/* Список модулей, подходящих слоту (для интерфейса).
   В списке остаётся только то, что реально встаёт на это место: серые
   «ненажимаемые» карточки не показываются, иначе меню забито мусором. */
function attachOptionsFor(slotKey) {
  const slot = attachSlots().find((s) => s.key === slotKey);
  if (!slot) return [];
  const accepts = __ATTACH.SYS.slotAccepts(slot);
  const out = [{ key: null, label: '— НЕТ —', fits: true }];
  for (const key of __ATTACH.REG.keys()) {
    let meta;
    /* модули с регулируемой длиной оцениваем уже подогнанными под слот */
    const opts = (slot.length && __ATTACH.REG.fitsLength(key)) ? { len: slot.length } : {};
    try { meta = __ATTACH.REG.meta(key, opts); } catch (e) { continue; }
    const face = __ATTACH.SYS.slotFace(slot);
    const wants = meta.slot === 'optic' && face === 'side' && meta.canBeOffset
      ? 'optic_offset' : meta.slot;
    if (accepts.indexOf(wants) < 0) continue;
    const fit = __ATTACH.SYS.checkFit(slot, Object.assign({ key }, meta),
      { caliber: ATTACH_DEF.caliber }, {});
    if (!fit.ok) continue;                    // несовместимое просто не предлагаем
    out.push({ key, label: meta.name, short: meta.short, fits: true });
  }
  return out;
}

/* Слоты: статические из описания + динамические от цевья. */
function attachSlots() {
  const base = ATTACH_DEF.slots.slice();
  if (ATTACH_STATE.asm && ATTACH_STATE.asm.slotsDynamic)
    for (const d of ATTACH_STATE.asm.slotsDynamic)
      if (!base.some((b) => b.key === d.key)) base.push(d);
  return base;
}

function attachNameOf(key) {
  try { return __ATTACH.REG.meta(key).name; } catch (e) { return String(key); }
}

/* Пересборка: снять старую группу, собрать новую, вернуть узлы. */
function attachRebuild(THREE, parent, baseParts, weaponNodes) {
  if (ATTACH_STATE.view) {
    parent.remove(ATTACH_STATE.view.root);
    ATTACH_STATE.view.dispose();
  }
  const weapon = {
    caliber: ATTACH_DEF.caliber, weight: ATTACH_DEF.weight,
    ballistics: ATTACH_DEF.ballistics, stats: {},
    base: baseParts || [], nodes: weaponNodes || {}, slots: attachSlots()
  };
  const asm = __ATTACH.SYS.assemble(weapon, __ATTACH.REG, ATTACH_STATE.config);
  const view = __ATTACH.ADAPTER.build(THREE, asm, { scale: 0.001 });
  parent.add(view.root);
  ATTACH_STATE.asm = asm;
  ATTACH_STATE.view = view;
  /* вернуть прежние состояния переключателей */
  view.setBeam('light', ATTACH_STATE.toggles.light);
  view.setBeam('laser', ATTACH_STATE.toggles.laser);
  view.setBeam('ir', ATTACH_STATE.toggles.ir);
  for (const k in ATTACH_STATE.toggles.deploy) view.setDeploy(k, ATTACH_STATE.toggles.deploy[k]);
  return asm;
}

/* Скрытие заменяемых деталей базовой модели: зоны включаются по конфигурации.
   Вызывается после каждой пересборки, поэтому снятие модуля возвращает
   исходную деталь на место. */
function attachOcclude(THREE, host) {
  if (!host) return null;
  return __ATTACH.OCC.apply(THREE, host, "ak74", ATTACH_STATE.config, {
    names: ATTACH_HIDE_BY_NAME, groups: {}
  });
}

/* Публичный API: смена модулей из консоли, автотестов и внешнего интерфейса.
   Реальная функция подстановки регистрируется интеграцией оружия. */
window.ATTACH = {
  set(slotKey, moduleKey) {
    if (!ATTACH_STATE.apply) throw new Error('система ещё не готова');
    ATTACH_STATE.apply(slotKey, moduleKey);
    return window.__ATTACH_DEBUG();
  },
  get: () => Object.assign({}, ATTACH_STATE.config),
  slots: () => attachSlots().map((s) => s.key),
  options: (slotKey) => attachOptionsFor(slotKey),
  preset: {
    save: () => __ATTACH.SYS.presetCodec().encode(ATTACH_STATE.config),
    load(code) {
      const cfg = __ATTACH.SYS.presetCodec().decode(code);
      /* Слоты-потомки (планки цевья и кронштейна) появляются только после
         установки носителя, поэтому список слотов перечитывается на каждом
         шаге, а проход повторяется, пока не перестанут возникать новые. */
      const done = {};
      for (let pass = 0; pass < 4; pass++) {
        const keys = attachSlots().map((s) => s.key);
        let changed = false;
        for (const k of keys) {
          if (done[k]) continue;
          done[k] = true;
          changed = true;
          window.ATTACH.set(k, cfg[k] || null);
        }
        if (!changed) break;
      }
      return window.__ATTACH_DEBUG();
    }
  },
  beam: (kind, level) => ATTACH_STATE.view.setBeam(kind, level),
  deploy: (slotKey, t) => ATTACH_STATE.view.setDeploy(slotKey, t),
  stats: () => (ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {})
};

/* Отладочный хук: состояние сборки доступно из консоли и автотестов. */
window.__ATTACH_DEBUG = () => ({
  weapon: "ak74",
  config: ATTACH_STATE.config,
  modules: ATTACH_STATE.asm ? Object.keys(ATTACH_STATE.asm.modules) : [],
  parts: ATTACH_STATE.asm ? ATTACH_STATE.asm.parts.length : 0,
  errors: ATTACH_STATE.asm ? ATTACH_STATE.asm.errors : [],
  warnings: ATTACH_STATE.asm ? ATTACH_STATE.asm.warnings : [],
  stats: ATTACH_STATE.asm ? ATTACH_STATE.asm.derived : {}
});

/* Управление с клавиатуры: TAB — панель, цифры — слот, стрелки — перебор. */

/* Есть ли на оружии прибор, который умеет светить/давать луч нужного типа.
   Физика простая: включать можно только то, что установлено. Клавиша не
   доставляет приборы «из воздуха» — она лишь щёлкает выключателем. */
function attachHasEmitter(kind) {
  const asm = ATTACH_STATE.asm;
  if (!asm) return false;
  for (const e of asm.emitters || []) {
    if (kind === 'light' && e.type === 'light') return true;
    if (kind === 'laser' && e.type === 'laser') return true;
    if (kind === 'ir' && e.type === 'ir') return true;
  }
  return false;
}

/* Короткое сообщение в панели: почему клавиша «не сработала». */
function attachNotify(text) {
  if (ATTACH_STATE.ui && ATTACH_STATE.ui.notify) ATTACH_STATE.ui.notify(text);
}

const BEAM_NAME = { light: 'фонарь', laser: 'ЛЦУ', ir: 'ИК-луч' };

function attachToggleBeam(kind) {
  if (!ATTACH_STATE.view) return;
  if (!attachHasEmitter(kind)) {
    /* прибора нет — гасим возможный остаточный флаг и сообщаем стрелку */
    ATTACH_STATE.toggles[kind] = 0;
    ATTACH_STATE.view.setBeam(kind, 0);
    attachNotify('Не установлен ' + (BEAM_NAME[kind] || kind) + ' — повесьте прибор на планку');
    return;
  }
  ATTACH_STATE.toggles[kind] = ATTACH_STATE.toggles[kind] ? 0 : 1;
  ATTACH_STATE.view.setBeam(kind, ATTACH_STATE.toggles[kind]);
}

/* После каждой пересборки: снятый прибор уносит с собой своё свечение. */
function attachSyncBeams() {
  for (const kind of ['light', 'laser', 'ir']) {
    if (!attachHasEmitter(kind)) ATTACH_STATE.toggles[kind] = 0;
    if (ATTACH_STATE.view) ATTACH_STATE.view.setBeam(kind, ATTACH_STATE.toggles[kind]);
  }
}

/* Складные узлы (сошки, приклад, магнифер) — то же правило: состояние
   живёт ровно столько, сколько стоит сам модуль. */
function attachSyncDeploy() {
  const asm = ATTACH_STATE.asm;
  const dep = ATTACH_STATE.toggles.deploy;
  for (const k in dep) if (!asm || !asm.modules[k]) delete dep[k];
  if (!ATTACH_STATE.view) return;
  for (const k in dep) ATTACH_STATE.view.setDeploy(k, dep[k]);
}

/* Модули, у которых есть подвижная часть. */
function attachFoldables() {
  const asm = ATTACH_STATE.asm;
  if (!asm) return [];
  return Object.keys(asm.modules).filter((sk) => {
    const m = asm.modules[sk].meta;
    return !!(m.deploy || m.fold || m.flipAxis || m.foldAxis);
  });
}

function attachBindKeys(onChange) {
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const ui = ATTACH_STATE.ui;
    if (e.code === 'Tab') { e.preventDefault(); if (ui) ui.toggle(!ui.visible()); return; }
    if (e.code === 'KeyC') { attachToggleBeam('light'); return; }
    if (e.code === 'KeyZ') { attachToggleBeam('laser'); return; }
    if (e.code === 'KeyX') { if (typeof window.__cycleFireMode === 'function') window.__cycleFireMode(); return; }
    if (e.code === 'KeyB') {
      const list = attachFoldables();
      if (!list.length) { attachNotify('Складывать нечего: сошки и складной приклад не установлены'); return; }
      for (const sk of list) {
        const cur = ATTACH_STATE.toggles.deploy[sk] || 0;
        const next = cur > 0.5 ? 0 : 1;
        ATTACH_STATE.toggles.deploy[sk] = next;
        ATTACH_STATE.view.setDeploy(sk, next);
      }
      return;
    }
    if (!ui || !ui.visible()) return;
    const slots = attachSlots();
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= slots.length) { ui.setActive(slots[n - 1].key); return; }
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
      const act = ui.getActive();
      if (!act) return;
      e.preventDefault();
      const opts = attachOptionsFor(act).filter((o) => o.fits);
      const cur = ATTACH_STATE.config[act] || null;
      let i = opts.findIndex((o) => o.key === cur);
      if (i < 0) i = 0;
      i = (i + (e.code === 'ArrowRight' ? 1 : opts.length - 1)) % opts.length;
      onChange(act, opts[i].key);
      ui.render();
    }
  });
}

    camera.position.copy(c).addScaledVector(d, dist);
    controls.update();
    pivot.rotation.y = 0;
    return { center: c.toArray(), min: box.min.toArray(), max: box.max.toArray() };
  };

  /* якорь прицельной камеры: глаз на линии прицеливания (чуть выше целика) */
  const adsAnchor = new THREE.Object3D();
  /* ATTACH: ось прицеливания */
  /* Глаз стрелка встаёт на ось активного прицела, на удалении зрачка за
     окуляром. Без оптики — механика: глаз за целиком, взгляд сквозь
     прорезь на мушку. Зум подбирается под кратность прицела: у механики
     и коллиматора он минимальный, у ПСО — по паспортному полю зрения. */
  /* Поле зрения в прицеле: см. комментарий в akm_viewer — прицел должен
     занимать часть кадра, а не весь экран. */
  const ADS_FOV_BASE = 30;
  const adsFov = (mag) => (mag > 1 ? ADS_FOV_BASE / mag : ADS_FOV_BASE);

  const attachSyncSight = () => {
    const asm = ATTACH_ASM;
    const a = asm && asm.activeOptic;
    if (a && asm.nodes.eye) {
      const e = asm.nodes.eye;
      adsAnchor.position.set(e[0] * 0.001, e[1] * 0.001, e[2] * 0.001);
      camState.fovAds = adsFov(a.magnify || 1);
      camState.optic = a;
    } else {
      /* механика АК-74: целик Y=116, Z=-248; глаз в 330 мм позади него,
         иначе камера оказывается внутри ствольной коробки */
      adsAnchor.position.set(0, mm(116), mm(82));
      camState.fovAds = ADS_FOV_BASE;
      camState.optic = null;
    }
    adsAnchor.rotation.set(0, 0, 0);
  };

  /* состояние камеры объявлено до синхронизации: она пишет fovAds */
  const camState = {
    ads: false, k: 0,                       // k: 0 = обзор, 1 = прицел
    fovFree: 34, fovAds: 17, optic: null,
    idle: 0, lastInput: performance.now()
  };
  attachSyncSight();
  tiltRig.add(adsAnchor);

  const freePos = new THREE.Vector3();
  const freeQuat = new THREE.Quaternion();
  const tmpV = new THREE.Vector3();
  const tmpQ = new THREE.Quaternion();

  const markInput = () => { camState.lastInput = performance.now(); };
  renderer.domElement.addEventListener('pointerdown', markInput);
  renderer.domElement.addEventListener('wheel', markInput, { passive: true });
  renderer.domElement.addEventListener('dblclick', () => {
    camera.position.copy(HOME);
    controls.target.copy(CENTER);
    controls.update();
    pivot.rotation.y = 0;
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ================================================================
     ЭФФЕКТЫ ВЫСТРЕЛА
     Вспышка АК-74 с ДТК: яркое ядро, короткий факел вперёд
     и две боковые струи из боковых окон тормоза.
     ================================================================ */
  const cv = (s) => { const c = document.createElement('canvas'); c.width = c.height = s; return c; };
  const mkTex = (c) => { const t = new THREE.CanvasTexture(c); if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true; return t; };

  /* мягкое ядро вспышки */
  const texGlow = (() => {
    const c = cv(128), g = c.getContext('2d');
    const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0.00, 'rgba(255,255,252,1)');
    r.addColorStop(0.16, 'rgba(255,246,206,0.95)');
    r.addColorStop(0.36, 'rgba(255,193,96,0.46)');
    r.addColorStop(0.66, 'rgba(255,126,38,0.13)');
    r.addColorStop(1.00, 'rgba(255,96,16,0)');
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
    return mkTex(c);
  })();

  /* звёздчатый факел с неровными лучами */
  const texStar = (() => {
    const c = cv(256), g = c.getContext('2d');
    g.translate(128, 128);
    const spikes = 9;
    for (let i = 0; i < spikes; i++) {
      const a = (i / spikes) * TAU + Math.random() * 0.22;
      const len = 118 * (0.42 + Math.random() * 0.58);
      const w = 0.055 + Math.random() * 0.075;
      const grd = g.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
      grd.addColorStop(0, 'rgba(255,250,225,0.95)');
      grd.addColorStop(0.35, 'rgba(255,203,110,0.42)');
      grd.addColorStop(1, 'rgba(255,120,30,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(Math.cos(a) * len, Math.sin(a) * len);
      g.lineTo(Math.cos(a - w) * 16, Math.sin(a - w) * 16);
      g.lineTo(Math.cos(a + w) * 16, Math.sin(a + w) * 16);
      g.closePath(); g.fill();
    }
    const r = g.createRadialGradient(0, 0, 0, 0, 0, 44);
    r.addColorStop(0, 'rgba(255,255,248,1)');
    r.addColorStop(0.45, 'rgba(255,226,150,0.5)');
    r.addColorStop(1, 'rgba(255,150,50,0)');
    g.fillStyle = r; g.beginPath(); g.arc(0, 0, 44, 0, TAU); g.fill();
    return mkTex(c);
  })();

  /* клуб дыма */
  const texSmoke = (() => {
    const c = cv(128), g = c.getContext('2d');
    for (let i = 0; i < 26; i++) {
      const x = 64 + (Math.random() - 0.5) * 62, y = 64 + (Math.random() - 0.5) * 62;
      const rad = 14 + Math.random() * 30;
      const r = g.createRadialGradient(x, y, 0, x, y, rad);
      r.addColorStop(0, 'rgba(255,255,255,0.16)');
      r.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = r; g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
    }
    const m = g.createRadialGradient(64, 64, 10, 64, 64, 64);
    m.addColorStop(0, 'rgba(0,0,0,0)');
    m.addColorStop(0.72, 'rgba(0,0,0,0)');
    m.addColorStop(1, 'rgba(0,0,0,1)');
    g.globalCompositeOperation = 'destination-out';
    g.fillStyle = m; g.fillRect(0, 0, 128, 128);
    return mkTex(c);
  })();

  const texSpark = (() => {
    const c = cv(64), g = c.getContext('2d');
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, 'rgba(255,255,240,1)');
    r.addColorStop(0.3, 'rgba(255,214,130,0.85)');
    r.addColorStop(1, 'rgba(255,120,30,0)');
    g.fillStyle = r; g.fillRect(0, 0, 64, 64);
    return mkTex(c);
  })();

  const addMat = (tex, col) => new THREE.SpriteMaterial({
    map: tex, color: col, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true, toneMapped: false
  });

  /* узел у дульного среза — едет вместе с отдачей */
  const muzzleRig = new THREE.Object3D();
  /* ATTACH: узлы от модулей */
  /* Точка вспышки — срез установленного дульного устройства. */
  const attachSyncMuzzle = () => {
    const v = ATTACH_ASM && ATTACH_ASM.nodes.muzzle;
    if (v) muzzleRig.position.set(v[0] * 0.001, v[1] * 0.001, v[2] * 0.001);
    else muzzleRig.position.copy(N.muzzle.position);
  };
  attachSyncMuzzle();
  tiltRig.add(muzzleRig);

  const flash = { t: -1, dur: 0.055, seed: 0 };
  const sprGlow = new THREE.Sprite(addMat(texGlow, 0xffd9a0));
  const sprStar = new THREE.Sprite(addMat(texStar, 0xffc98a));
  const sprCore = new THREE.Sprite(addMat(texGlow, 0xffffff));
  sprGlow.position.z = mm(-16); sprStar.position.z = mm(-22); sprCore.position.z = mm(-6);
  muzzleRig.add(sprGlow, sprStar, sprCore);

  /* факел вперёд и две боковые струи (боковые окна ДТК) */
  const jetMat = () => new THREE.MeshBasicMaterial({
    color: 0xffb765, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, side: THREE.DoubleSide
  });
  const mkJet = (len, rad) => {
    const g = new THREE.ConeGeometry(rad, len, 14, 1, true);
    g.translate(0, -len / 2, 0);
    g.rotateX(-Math.PI / 2);          // остриё вдоль -Z
    return new THREE.Mesh(g, jetMat());
  };
  const jetMain = mkJet(mm(120), mm(30));
  muzzleRig.add(jetMain);
  const jetSide = [];
  for (let i = 0; i < 2; i++) {
    const j = mkJet(mm(58), mm(15));
    j.position.set(0, 0, mm(46));                  // у боковых окон тормоза
    j.rotation.y = (i ? -1 : 1) * D(74);
    muzzleRig.add(j);
    jetSide.push(j);
  }

  /* кольцо ударной волны */
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.72, 1.0, 40),
    new THREE.MeshBasicMaterial({ color: 0xffd7a8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false })
  );
  ring.position.z = mm(-30);
  muzzleRig.add(ring);

  /* вспышка как источник света */
  const flashLight = new THREE.PointLight(0xffb268, 0, 4.2, 2.0);
  flashLight.position.set(0, 0, mm(-40));
  muzzleRig.add(flashLight);
  const portLight = new THREE.PointLight(0xffa050, 0, 1.4, 2.0);
  portLight.position.copy(N.eject.position);
  tiltRig.add(portLight);

  /* ---------- искры ---------- */
  const SPK = 110;
  const spkPos = new Float32Array(SPK * 3), spkCol = new Float32Array(SPK * 3);
  const spkGeo = new THREE.BufferGeometry();
  spkGeo.setAttribute('position', new THREE.BufferAttribute(spkPos, 3));
  spkGeo.setAttribute('color', new THREE.BufferAttribute(spkCol, 3));
  const sparks = new THREE.Points(spkGeo, new THREE.PointsMaterial({
    size: 0.011, map: texSpark, vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, toneMapped: false
  }));
  sparks.frustumCulled = false;
  scene.add(sparks);
  const spk = [];
  for (let i = 0; i < SPK; i++) spk.push({ t: 0, ttl: 0, p: new THREE.Vector3(), v: new THREE.Vector3(), hot: 1 });

  /* ---------- дым ---------- */
  const SMK = 18;
  const smoke = [];
  for (let i = 0; i < SMK; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: texSmoke, color: 0x8d939b, transparent: true, opacity: 0,
      depthWrite: false, toneMapped: false
    }));
    s.visible = false;
    scene.add(s);
    smoke.push({ o: s, t: 0, ttl: 0, v: new THREE.Vector3(), r0: 0, rot: 0, spin: 0 });
  }

  /* ---------- гильзы ---------- */
  const CASES = 12;
  const cases = [];
  for (let i = 0; i < CASES; i++) {
    const m = new THREE.Mesh(gun.extra.caseGeo, gun.extra.brass);
    m.castShadow = true;
    m.visible = false;
    scene.add(m);
    cases.push({ o: m, t: 0, ttl: 0, v: new THREE.Vector3(), w: new THREE.Vector3(), rest: false });
  }

  /* вспомогательные векторы */
  const wPos = new THREE.Vector3(), wQ = new THREE.Quaternion();
  const vDir = new THREE.Vector3(), vRight = new THREE.Vector3(), vUp = new THREE.Vector3();
  const FLOOR_Y = mm(-168);

  const spawnSparks = (n) => {
    muzzleRig.getWorldPosition(wPos);
    muzzleRig.getWorldQuaternion(wQ);
    vDir.set(0, 0, -1).applyQuaternion(wQ);
    vRight.set(1, 0, 0).applyQuaternion(wQ);
    vUp.set(0, 1, 0).applyQuaternion(wQ);
    let made = 0;
    for (let i = 0; i < SPK && made < n; i++) {
      const s = spk[i];
      if (s.t < s.ttl) continue;
      made++;
      s.t = 0; s.ttl = rnd(0.10, 0.42); s.hot = rnd(0.7, 1);
      s.p.copy(wPos).addScaledVector(vDir, rnd(0.005, 0.05));
      const side = Math.random() < 0.34;
      const sp = side ? rnd(1.4, 3.4) : rnd(2.6, 7.5);
      s.v.copy(vDir).multiplyScalar(side ? rnd(0.15, 0.7) : 1)
        .addScaledVector(vRight, side ? (Math.random() < 0.5 ? -1 : 1) * rnd(0.5, 1.1) : rnd(-0.3, 0.3))
        .addScaledVector(vUp, rnd(-0.25, 0.45))
        .normalize().multiplyScalar(sp);
    }
  };

  const spawnSmoke = (n, hot) => {
    muzzleRig.getWorldPosition(wPos);
    muzzleRig.getWorldQuaternion(wQ);
    vDir.set(0, 0, -1).applyQuaternion(wQ);
    vRight.set(1, 0, 0).applyQuaternion(wQ);
    let made = 0;
    for (let i = 0; i < SMK && made < n; i++) {
      const s = smoke[i];
      if (s.t < s.ttl) continue;
      made++;
      s.t = 0; s.ttl = rnd(0.75, 1.65);
      s.r0 = rnd(0.022, 0.05);
      s.rot = rnd(0, TAU); s.spin = rnd(-0.7, 0.7);
      s.o.position.copy(wPos).addScaledVector(vDir, rnd(0.01, 0.09));
      s.o.visible = true;
      s.o.material.opacity = 0;
      s.v.copy(vDir).multiplyScalar(rnd(0.35, 1.5) * (hot ? 1.4 : 1))
        .addScaledVector(vRight, rnd(-0.35, 0.35))
        .add(new THREE.Vector3(0, rnd(0.05, 0.3), 0));
    }
  };

  const ejectCase = () => {
    const src = N.caseSpawn;
    src.getWorldPosition(wPos);
    tiltRig.getWorldQuaternion(wQ);
    const d = gun.dirs.eject;
    vDir.set(d[0], d[1], d[2]).applyQuaternion(wQ).normalize();
    for (let i = 0; i < CASES; i++) {
      const c = cases[i];
      if (c.t < c.ttl) continue;
      c.t = 0; c.ttl = 3.2; c.rest = false;
      c.o.visible = true;
      c.o.position.copy(wPos);
      c.o.quaternion.copy(wQ);
      c.v.copy(vDir).multiplyScalar(rnd(2.3, 3.2));
      c.v.x += rnd(-0.35, 0.35); c.v.y += rnd(0.15, 0.7); c.v.z += rnd(-0.3, 0.3);
      c.w.set(rnd(-34, 34), rnd(-26, 26), rnd(-42, 42));
      return;
    }
  };

  /* ---------- обновление эффектов ---------- */
  const flashState = { t: 1e9, seed: 0, power: 1 };

  const triggerFlash = (power) => {
    flashState.t = 0;
    flashState.power = power === undefined ? 1 : power;
    flashState.seed = rnd(0, TAU);
    sprStar.material.rotation = flashState.seed;
    sprGlow.material.rotation = rnd(0, TAU);
    jetMain.scale.set(rnd(0.82, 1.22), rnd(0.82, 1.22), rnd(0.78, 1.3));
    jetSide[0].rotation.y = D(rnd(66, 82));
    jetSide[1].rotation.y = -D(rnd(66, 82));
    spawnSparks(Math.round(rnd(9, 17)));
    spawnSmoke(2, true);
    setTimeout(() => spawnSmoke(1, false), 70);
  };

  const updateFX = (dt) => {
    /* вспышка */
    flashState.t += dt;
    const ft = flashState.t, FD = 0.062;
    if (ft <= FD) {
      const u = ft / FD;
      const rise = Math.min(1, ft / 0.0045);
      const a = rise * Math.pow(1 - u, 2.35) * flashState.power;
      sprCore.material.opacity = a;
      sprCore.scale.setScalar(mm(52) * (0.75 + 0.5 * u));
      sprGlow.material.opacity = a * 0.8;
      sprGlow.scale.setScalar(mm(150) * (0.7 + 0.85 * u));
      sprStar.material.opacity = a * 0.92;
      sprStar.scale.setScalar(mm(250) * (0.55 + 0.95 * u));
      jetMain.material.opacity = a * 0.62;
      jetSide[0].material.opacity = jetSide[1].material.opacity = a * 0.5 * Math.max(0, 1 - u * 1.5);
      ring.material.opacity = 0.42 * Math.pow(1 - u, 1.6);
      ring.scale.setScalar(mm(28) + mm(420) * u);
      flashLight.intensity = a * 30;
      portLight.intensity = a * 4.5;
    } else if (sprCore.material.opacity !== 0) {
      sprCore.material.opacity = sprGlow.material.opacity = sprStar.material.opacity = 0;
      jetMain.material.opacity = jetSide[0].material.opacity = jetSide[1].material.opacity = 0;
      ring.material.opacity = 0;
      flashLight.intensity = portLight.intensity = 0;
    }

    /* искры */
    let any = false;
    for (let i = 0; i < SPK; i++) {
      const s = spk[i], k = i * 3;
      if (s.t >= s.ttl) { spkCol[k] = spkCol[k + 1] = spkCol[k + 2] = 0; continue; }
      any = true;
      s.t += dt;
      s.v.y -= 9.81 * dt;
      s.v.multiplyScalar(1 - Math.min(1, 3.4 * dt));
      s.p.addScaledVector(s.v, dt);
      const u = clamp(s.t / s.ttl, 0, 1), f = Math.pow(1 - u, 1.7) * s.hot;
      spkPos[k] = s.p.x; spkPos[k + 1] = s.p.y; spkPos[k + 2] = s.p.z;
      spkCol[k] = 1.6 * f; spkCol[k + 1] = 0.72 * f * f; spkCol[k + 2] = 0.22 * f * f * f;
    }
    spkGeo.attributes.position.needsUpdate = true;
    spkGeo.attributes.color.needsUpdate = true;
    sparks.visible = any;

    /* дым */
    for (let i = 0; i < SMK; i++) {
      const s = smoke[i];
      if (s.t >= s.ttl) { if (s.o.visible) s.o.visible = false; continue; }
      s.t += dt;
      const u = clamp(s.t / s.ttl, 0, 1);
      s.v.multiplyScalar(1 - Math.min(1, 1.5 * dt));
      s.v.y += 0.28 * dt;
      s.o.position.addScaledVector(s.v, dt);
      s.rot += s.spin * dt;
      s.o.material.rotation = s.rot;
      s.o.material.opacity = 0.30 * Math.sin(Math.PI * Math.pow(u, 0.55)) * (1 - u * 0.25);
      s.o.scale.setScalar(s.r0 * (1 + 3.6 * u));
    }

    /* гильзы */
    for (let i = 0; i < CASES; i++) {
      const c = cases[i];
      if (c.t >= c.ttl) { if (c.o.visible) c.o.visible = false; continue; }
      c.t += dt;
      if (!c.rest) {
        c.v.y -= 9.81 * dt;
        c.o.position.addScaledVector(c.v, dt);
        c.o.rotateX(c.w.x * dt); c.o.rotateY(c.w.y * dt); c.o.rotateZ(c.w.z * dt);
        if (c.o.position.y <= FLOOR_Y + mm(5)) {
          c.o.position.y = FLOOR_Y + mm(5);
          if (Math.abs(c.v.y) < 0.35) { c.rest = true; c.v.set(0, 0, 0); }
          else {
            c.v.y = -c.v.y * 0.34;
            c.v.x *= 0.55; c.v.z *= 0.55;
            c.w.multiplyScalar(0.45);
            if (audio.on) audio.caseHit(Math.min(1, Math.abs(c.v.y) * 1.6));
          }
        }
      }
      if (c.t > c.ttl - 0.6) {
        const k = clamp((c.ttl - c.t) / 0.6, 0, 1);
        c.o.scale.setScalar(k);
      } else c.o.scale.setScalar(1);
    }
  };

  /* ================================================================
     ЗВУК. Синтез без внешних файлов: резкий фронт +
     низкий гул + металлическая механика + хвост отражений.
     ================================================================ */
  const audio = {
    ctx: null, on: true, master: null, dry: null, conv: null, nb: null,

    init() {
      if (audio.ctx) return audio.ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { audio.on = false; return null; }
      const ctx = audio.ctx = new AC();

      const master = ctx.createGain(); master.gain.value = 0.82;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -15; comp.knee.value = 24; comp.ratio.value = 8;
      comp.attack.value = 0.0016; comp.release.value = 0.24;
      master.connect(comp); comp.connect(ctx.destination);

      const dry = ctx.createGain(); dry.gain.value = 1; dry.connect(master);

      /* хвост открытого пространства */
      const conv = ctx.createConvolver();
      conv.buffer = audio.mkIR(ctx, 1.65);
      const wet = ctx.createGain(); wet.gain.value = 0.5;
      conv.connect(wet); wet.connect(master);

      /* шлепок-эхо от дальней преграды */
      const dl = ctx.createDelay(1.0); dl.delayTime.value = 0.128;
      const dlLP = ctx.createBiquadFilter(); dlLP.type = 'lowpass'; dlLP.frequency.value = 1250;
      const fb = ctx.createGain(); fb.gain.value = 0.26;
      const dlG = ctx.createGain(); dlG.gain.value = 0.34;
      dl.connect(dlLP); dlLP.connect(fb); fb.connect(dl); dlLP.connect(dlG); dlG.connect(master);

      audio.master = master; audio.dry = dry; audio.conv = conv; audio.echo = dl;
      audio.nb = audio.mkNoise(ctx, 2.2);
      return ctx;
    },

    mkNoise(ctx, sec) {
      const n = Math.floor(ctx.sampleRate * sec);
      const b = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = b.getChannelData(c);
        let last = 0;
        for (let i = 0; i < n; i++) {
          const w = Math.random() * 2 - 1;
          last = 0.86 * last + 0.14 * w;          // лёгкая окраска
          d[i] = w * 0.72 + last * 0.55;
        }
      }
      return b;
    },

    /* импульсный отклик: ранние отражения + плотный хвост */
    mkIR(ctx, sec) {
      const n = Math.floor(ctx.sampleRate * sec);
      const b = ctx.createBuffer(2, n, ctx.sampleRate);
      const taps = [0.011, 0.019, 0.031, 0.047, 0.062, 0.081, 0.104, 0.133, 0.171, 0.216];
      for (let c = 0; c < 2; c++) {
        const d = b.getChannelData(c);
        let lp = 0;
        for (let i = 0; i < n; i++) {
          const t = i / ctx.sampleRate;
          const env = Math.pow(1 - t / sec, 2.6) * Math.exp(-t * 1.55);
          const w = Math.random() * 2 - 1;
          lp = lp * 0.62 + w * 0.38;                // глушим верх
          d[i] = (w * 0.35 + lp * 0.65) * env * 0.55;
        }
        for (let k = 0; k < taps.length; k++) {
          const idx = Math.floor((taps[k] + (c ? 0.0035 : 0)) * ctx.sampleRate);
          if (idx < n) d[idx] += (Math.random() < 0.5 ? -1 : 1) * 0.5 * Math.pow(1 - k / taps.length, 1.7);
        }
      }
      return b;
    },

    /* шумовой слой */
    nz(t0, dur, o) {
      const ctx = audio.ctx; o = o || {};
      const src = ctx.createBufferSource();
      src.buffer = audio.nb; src.loop = true;
      src.playbackRate.value = o.rate || 1;
      const off = Math.random() * 1.6;
      let node = src;
      if (o.type) {
        const f = ctx.createBiquadFilter();
        f.type = o.type; f.Q.value = o.q === undefined ? 1 : o.q;
        f.frequency.setValueAtTime(o.freq || 1000, t0);
        if (o.freq2) f.frequency.exponentialRampToValueAtTime(o.freq2, t0 + dur);
        node.connect(f); node = f;
      }
      if (o.hp) {
        const h = ctx.createBiquadFilter();
        h.type = 'highpass'; h.frequency.value = o.hp; h.Q.value = 0.7;
        node.connect(h); node = h;
      }
      const g = ctx.createGain();
      const pk = Math.max(0.0006, o.gain === undefined ? 0.3 : o.gain);
      const atk = o.atk === undefined ? 0.0012 : o.atk;
      g.gain.setValueAtTime(0.0004, t0);
      g.gain.exponentialRampToValueAtTime(pk, t0 + atk);
      g.gain.exponentialRampToValueAtTime(0.0004, t0 + dur);
      g.gain.setValueAtTime(0, t0 + dur + 0.005);
      node.connect(g);
      g.connect(audio.dry);
      if (o.wet) { const w = ctx.createGain(); w.gain.value = o.wet; g.connect(w); w.connect(audio.conv); }
      if (o.echo) { const e = ctx.createGain(); e.gain.value = o.echo; g.connect(e); e.connect(audio.echo); }
      src.start(t0, off); src.stop(t0 + dur + 0.03);
    },

    /* тональный слой (низ и короткие резонансы) */
    osc(t0, dur, f0, f1, gain, type, o) {
      const ctx = audio.ctx; o = o || {};
      const s = ctx.createOscillator();
      s.type = type || 'sine';
      s.frequency.setValueAtTime(f0, t0);
      if (f1 && f1 !== f0) s.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0004, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0006, gain), t0 + (o.atk || 0.0015));
      g.gain.exponentialRampToValueAtTime(0.0004, t0 + dur);
      g.gain.setValueAtTime(0, t0 + dur + 0.005);
      s.connect(g); g.connect(audio.dry);
      if (o.wet) { const w = ctx.createGain(); w.gain.value = o.wet; g.connect(w); w.connect(audio.conv); }
      if (o.echo) { const e = ctx.createGain(); e.gain.value = o.echo; g.connect(e); e.connect(audio.echo); }
      s.start(t0); s.stop(t0 + dur + 0.03);
    },

    now(d) { return audio.ctx.currentTime + (d || 0); }
  };

  /* ---------- выстрел: жёсткий фронт + низкий гул + отражения ---------- */
  audio.shot = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.0015);
    const p = 1 + rnd(-0.045, 0.045);
    const v = rnd(0.93, 1.07);

    audio.nz(t, 0.010, { type: 'highpass', freq: 2900 * p, q: 0.6, gain: 0.62 * v, atk: 0.0005, wet: 0.22, echo: 0.18 });
    audio.nz(t + 0.0007, 0.080, { type: 'bandpass', freq: 760 * p, q: 0.7, gain: 1.05 * v, atk: 0.0009, wet: 0.62, echo: 0.52 });
    audio.nz(t + 0.001, 0.030, { type: 'bandpass', freq: 1780 * p, q: 1.0, gain: 0.46 * v, atk: 0.0007, wet: 0.30, echo: 0.24 });
    audio.nz(t + 0.002, 0.270, { type: 'lowpass', freq: 205, q: 0.9, gain: 0.66 * v, atk: 0.0045, wet: 0.55, echo: 0.42 });
    audio.osc(t + 0.001, 0.170, 152 * p, 43, 0.52 * v, 'sine', { wet: 0.42, echo: 0.3 });
    audio.osc(t + 0.0015, 0.090, 94 * p, 37, 0.34 * v, 'triangle', { wet: 0.24 });
    audio.nz(t + 0.030, 0.520, { type: 'lowpass', freq: 760, q: 0.6, gain: 0.13, atk: 0.022, wet: 0.95, echo: 0.75 });
    /* механика автоматики внутри цикла */
    audio.nz(t + 0.022, 0.028, { type: 'bandpass', freq: 2400, q: 1.7, gain: 0.15 });
    audio.nz(t + 0.058, 0.042, { type: 'bandpass', freq: 1450, q: 1.2, gain: 0.20 });
    audio.osc(t + 0.059, 0.055, 235, 118, 0.10, 'triangle');
  };

  /* ---------- механика ---------- */
  audio.dryFire = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.001);
    audio.nz(t, 0.008, { type: 'highpass', freq: 2200, q: 0.7, gain: 0.28 });
    audio.nz(t + 0.001, 0.030, { type: 'bandpass', freq: 1150, q: 2.2, gain: 0.18, wet: 0.2 });
    audio.osc(t + 0.001, 0.030, 340, 180, 0.05, 'triangle');
  };

  audio.trig = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.001);
    audio.nz(t, 0.012, { type: 'bandpass', freq: 1900, q: 2.4, gain: 0.10 });
  };

  audio.selector = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.001);
    audio.nz(t, 0.010, { type: 'bandpass', freq: 2600, q: 2.6, gain: 0.24, wet: 0.18 });
    audio.osc(t, 0.020, 900, 520, 0.06, 'square');
  };

  audio.magRelease = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.001);
    audio.nz(t, 0.014, { type: 'bandpass', freq: 2350, q: 2.0, gain: 0.30, wet: 0.2 });
    audio.osc(t, 0.028, 760, 380, 0.09, 'triangle', { wet: 0.15 });
  };

  audio.magOut = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.001);
    audio.nz(t, 0.110, { type: 'bandpass', freq: 880, q: 0.9, gain: 0.20, atk: 0.012, wet: 0.22 });
    audio.nz(t + 0.055, 0.060, { type: 'lowpass', freq: 620, q: 0.8, gain: 0.24, atk: 0.002, wet: 0.25 });
    audio.osc(t + 0.056, 0.070, 210, 96, 0.13, 'triangle', { wet: 0.2 });
  };

  audio.magIn = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.001);
    /* носок зацепился за окно */
    audio.nz(t, 0.045, { type: 'lowpass', freq: 900, q: 0.8, gain: 0.30, atk: 0.0015, wet: 0.25 });
    audio.osc(t, 0.055, 260, 120, 0.16, 'triangle', { wet: 0.2 });
    /* доворот и защёлкивание защёлки */
    audio.nz(t + 0.105, 0.040, { type: 'bandpass', freq: 1750, q: 1.5, gain: 0.42, wet: 0.3, echo: 0.12 });
    audio.nz(t + 0.105, 0.075, { type: 'lowpass', freq: 380, q: 0.9, gain: 0.34, atk: 0.002, wet: 0.28 });
    audio.osc(t + 0.106, 0.090, 168, 74, 0.22, 'sine', { wet: 0.25 });
  };

  audio.chargePull = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.001);
    audio.nz(t, 0.135, { type: 'bandpass', freq: 1150, freq2: 1750, q: 1.1, gain: 0.30, atk: 0.020, wet: 0.28 });
    audio.nz(t + 0.010, 0.120, { type: 'highpass', freq: 3200, q: 0.7, gain: 0.10, atk: 0.03 });
    audio.osc(t + 0.020, 0.110, 520, 880, 0.045, 'sawtooth');   // пружина
    audio.nz(t + 0.140, 0.035, { type: 'bandpass', freq: 2050, q: 1.8, gain: 0.34, wet: 0.28 });
  };

  audio.boltRelease = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.001);
    audio.nz(t, 0.055, { type: 'bandpass', freq: 1520, q: 1.0, gain: 0.62, atk: 0.0008, wet: 0.4, echo: 0.2 });
    audio.nz(t, 0.130, { type: 'lowpass', freq: 320, q: 0.9, gain: 0.40, atk: 0.002, wet: 0.35, echo: 0.15 });
    audio.osc(t, 0.120, 175, 62, 0.28, 'sine', { wet: 0.3 });
    audio.nz(t + 0.006, 0.030, { type: 'highpass', freq: 3400, q: 0.7, gain: 0.16 });
  };

  /* Удар гильзы о пол. Тональные осцилляторы давали «колокольчик»:
     латунь звенит очень коротко, поэтому оставляем только резонансный шум. */
  audio.caseHit = (v) => {
    if (!audio.on || !audio.ctx) return;
    const t = audio.now(0.001);
    const g = 0.085 * clamp(v, 0.15, 1);
    audio.nz(t, 0.026, { type: 'bandpass', freq: rnd(3000, 5200), q: 6.5, gain: g, wet: 0.24 });
    audio.nz(t + 0.004, 0.018, { type: 'highpass', freq: 5200, q: 0.8, gain: g * 0.4, wet: 0.2 });
  };

  /* ================= состояние оружия ================= */
  const MAG = 30, RATE = 0.092, RELOAD_LEN = 2.48;
  const ammoEl = document.getElementById('ammo');
  const btnFire = document.getElementById('fire');
  const btnRel = document.getElementById('rel');
  const btnAds = document.getElementById('ads');
  const btnMode = document.getElementById('mode');
  const btnSnd = document.getElementById('snd');

  let ammo = MAG;
  let magCap = MAG;                       // ATTACH: реальная ёмкость от модуля
  const setAmmo = (v) => {
    ammo = v;
    ammoEl.textContent = String(v);
    ammoEl.classList.toggle('low', v <= 5);
  };

  const boltZ = gun.anim.boltTravel;        // ход рамы, м
  const trigA = gun.anim.triggerPull;       // угол спуска, рад
  const REC = mm(12);

  const st = { shot: 9, cool: 0, hold: false, eject: false, side: 1, reload: -1, cue: 0,
    mode: 'auto', semiLatch: false, safeCue: false };
  /* Переводчик АК-74: предохранитель — автоматический — одиночный. */
  const MODE_ORDER = ['safe', 'auto', 'semi'];
  const MODE_NAME = { safe: 'ПРЕДОХР', auto: 'АВТО', semi: 'ОДИНОЧНЫЙ' };

  /* ---------- кривые ---------- */
  const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u));
  const recoilCurve = (t) => {
    if (t < 0) return 0;
    if (t < 0.014) return t / 0.014;
    const u = (t - 0.014) / 0.175;
    if (u >= 1) return 0;
    return Math.cos(u * 6.6) * Math.exp(-u * 4.1) * (1 - u * u);
  };
  const boltCycle = (t) => {
    if (t < 0) return 0;
    if (t < 0.026) return ease(t / 0.026);
    if (t < 0.038) return 1;
    if (t < 0.080) return 1 - ease((t - 0.038) / 0.042);
    return 0;
  };
  const boltReload = (t) => {
    if (t < 1.95) return 0;
    if (t < 2.07) return ease((t - 1.95) / 0.12);
    if (t < 2.14) return 1;
    if (t < 2.20) return 1 - ease((t - 2.14) / 0.06);
    return 0;
  };

  /* ---------- ключевые кадры магазина (p — метры, r — рад) ---------- */
  const MKEY = [
    { t: 0.00, p: [0, 0, 0], r: 0, v: 1 },
    { t: 0.16, p: [0, 0, 0], r: 0, v: 1 },
    { t: 0.31, p: [0, 0.002, -0.004], r: 0.155, v: 1 },
    { t: 0.64, p: [0, -0.33, -0.05], r: 0.30, v: 1 },
    { t: 0.72, p: [0, -0.52, -0.06], r: 0.34, v: 0 },
    { t: 1.16, p: [0.02, -0.44, -0.02], r: 0.34, v: 0 },
    { t: 1.22, p: [0.015, -0.42, -0.02], r: 0.30, v: 1 },
    { t: 1.46, p: [0, -0.006, -0.007], r: 0.165, v: 1 },
    { t: 1.60, p: [0, 0, 0], r: 0, v: 1 },
    { t: 9.00, p: [0, 0, 0], r: 0, v: 1 }
  ];
  const magAt = (t, out) => {
    let i = 0;
    while (i < MKEY.length - 2 && t >= MKEY[i + 1].t) i++;
    const a = MKEY[i], b = MKEY[i + 1];
    const u = ease((t - a.t) / Math.max(1e-4, b.t - a.t));
    out.x = a.p[0] + (b.p[0] - a.p[0]) * u;
    out.y = a.p[1] + (b.p[1] - a.p[1]) * u;
    out.z = a.p[2] + (b.p[2] - a.p[2]) * u;
    out.r = a.r + (b.r - a.r) * u;
    out.v = a.v === 1;
    return out;
  };
  const magPose = { x: 0, y: 0, z: 0, r: 0, v: true };

  /* ---------- звуковые метки перезарядки ---------- */
  const CUES = [
    [0.00, () => audio.magRelease()],
    [0.17, () => audio.magOut()],
    [1.34, () => audio.magIn()],
    [1.95, () => audio.chargePull()],
    [2.15, () => { audio.boltRelease(); setAmmo(magCap); }]
  ];

  const startReload = () => {
    if (st.reload >= 0 || ammo === MAG) return;
    st.reload = 0; st.cue = 0;
    btnRel.classList.add('off');
    markInput();
  };

  const shoot = () => {
    if (st.reload >= 0 || st.cool > 0) return;
    if (st.mode === 'safe') {
      if (!st.safeCue) {
        st.safeCue = true;
        audio.dryFire();
        gun.parts.trigger.rotation.x = -trigA * 0.35;
        setTimeout(() => { if (st.reload < 0) gun.parts.trigger.rotation.x = 0; }, 90);
      }
      return;
    }
    if (st.mode === 'semi' && st.semiLatch) return;
    if (ammo <= 0) {
      st.cool = 0.28;
      st.shot = 9;
      audio.dryFire();
      gun.parts.trigger.rotation.x = -trigA;
      setTimeout(() => { if (st.reload < 0) gun.parts.trigger.rotation.x = 0; }, 90);
      return;
    }
    if (st.mode === 'semi') st.semiLatch = true;
    st.cool = RATE * rnd(0.97, 1.03);
    st.shot = 0;
    st.eject = false;
    st.side = Math.random() < 0.5 ? -1 : 1;
    setAmmo(ammo - 1);
    audio.shot();
    triggerFlash(ammo === 0 ? 1.12 : rnd(0.9, 1.08));
    markInput();
  };

  /* ---------- анимация оружия ---------- */
  const updateGun = (dt) => {
    st.cool = Math.max(0, st.cool - dt);
    st.shot += dt;

    let bolt = boltCycle(st.shot);
    let rec = recoilCurve(st.shot);
    let trig = st.shot < 0.085 ? Math.sin(clamp(st.shot / 0.085, 0, 1) * Math.PI) : 0;
    let roll = 0;

    if (!st.eject && st.shot >= 0.028 && st.shot < 0.2) { st.eject = true; ejectCase(); }

    if (st.reload >= 0) {
      st.reload += dt;
      const t = st.reload;
      while (st.cue < CUES.length && t >= CUES[st.cue][0]) { CUES[st.cue][1](); st.cue++; }
      magAt(t, magPose);
      gun.parts.magazine.position.set(magPose.x, magPose.y, magPose.z);
      gun.parts.magazine.rotation.x = magPose.r;
      gun.parts.magazine.visible = magPose.v;
      bolt = Math.max(bolt, boltReload(t));
      trig = 0;
      roll = D(-10) * (ease((t - 0.10) / 0.30) - ease((t - 1.92) / 0.36));
      if (t >= 2.20) {
        const k = 1 - ease((t - 2.20) / 0.16);
        rec = Math.max(rec, -0.22 * k);
      }
      if (t >= RELOAD_LEN) {
        st.reload = -1;
        btnRel.classList.remove('off');
        gun.parts.magazine.position.set(0, 0, 0);
        gun.parts.magazine.rotation.x = 0;
        gun.parts.magazine.visible = true;
      }
    }

    const soft = 1 - 0.3 * camState.k;
    recoilRig.position.z = REC * rec * soft;
    recoilRig.rotation.z = roll * (1 - 0.55 * camState.k);
    tiltRig.rotation.x = D(1.8) * rec * soft;
    tiltRig.rotation.z = D(0.5) * rec * st.side * soft;
    gun.parts.bolt.position.z = boltZ * bolt;
    gun.parts.trigger.rotation.x = -trigA * trig;
  };

  /* ================= камера ================= */
  audio.handle = () => {
    if (!audio.on || !audio.init()) return;
    const t = audio.now(0.001);
    audio.nz(t, 0.085, { type: 'bandpass', freq: 640, q: 0.8, gain: 0.075, atk: 0.014 });
    audio.nz(t + 0.028, 0.055, { type: 'highpass', freq: 2500, q: 0.7, gain: 0.030, atk: 0.012 });
  };

  const updateCamera = (dt, now) => {
    const target = camState.ads ? 1 : 0;
    camState.k += (target - camState.k) * Math.min(1, dt * 8.5);
    if (Math.abs(camState.k - target) < 0.0015) camState.k = target;

    if (camState.k > 0.0005) {
      pivot.rotation.y += (0 - pivot.rotation.y) * Math.min(1, dt * 5);
    } else if ((now - camState.lastInput) / 1000 > 7) {
      pivot.rotation.y += dt * 0.13;
    }

    if (camState.k === 0) {
      controls.enabled = true;
      controls.update();
      freePos.copy(camera.position);
      freeQuat.copy(camera.quaternion);
      if (camera.fov !== camState.fovFree) { camera.fov = camState.fovFree; camera.updateProjectionMatrix(); }
    } else {
      controls.enabled = false;
      adsAnchor.updateWorldMatrix(true, false);
      adsAnchor.getWorldPosition(tmpV);
      adsAnchor.getWorldQuaternion(tmpQ);
      const e = camState.k * camState.k * (3 - 2 * camState.k);
      camera.position.copy(freePos).lerp(tmpV, e);
      camera.quaternion.copy(freeQuat).slerp(tmpQ, e);
      const fov = camState.fovFree + (camState.fovAds - camState.fovFree) * e;
      if (Math.abs(fov - camera.fov) > 0.002) { camera.fov = fov; camera.updateProjectionMatrix(); }
    }
  };

  const setAds = (on) => {
    if (camState.ads === on) return;
    camState.ads = on;
    btnAds.classList.toggle('on', on);
    audio.handle();
    markInput();
  };

  /* ================= управление ================= */
  const resumeAudio = () => {
    const c = audio.init();
    if (c && c.state === 'suspended') c.resume();
  };

  const pulseRel = () => {
    btnRel.classList.add('on');
    setTimeout(() => btnRel.classList.remove('on'), 220);
  };

  const pressFire = () => {
    resumeAudio();
    const dry = ammo <= 0 && st.reload < 0;
    st.hold = true;
    shoot();
    if (dry) pulseRel();
  };
  const releaseFire = () => { st.hold = false; st.semiLatch = false; st.safeCue = false; };

  const syncMode = () => {
    if (!btnMode) return;
    btnMode.textContent = MODE_NAME[st.mode];
    btnMode.classList.toggle('on', st.mode !== 'safe');
  };
  const cycleFireMode = () => {
    st.mode = MODE_ORDER[(MODE_ORDER.indexOf(st.mode) + 1) % MODE_ORDER.length];
    st.semiLatch = false;
    st.safeCue = false;
    resumeAudio();
    audio.selector();
    syncMode();
  };
  window.__cycleFireMode = cycleFireMode;
  if (btnMode) btnMode.addEventListener('click', cycleFireMode);
  syncMode();

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!e.repeat) pressFire();
      return;
    }
    if (e.repeat) return;
    if (e.code === 'KeyR') { e.preventDefault(); resumeAudio(); startReload(); }
    else if (e.code === 'KeyF') { e.preventDefault(); resumeAudio(); setAds(!camState.ads); }
    else if (e.code === 'Escape') setAds(false);
    markInput();
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space') releaseFire(); });

  renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
  renderer.domElement.addEventListener('pointerdown', (e) => {
    resumeAudio();
    if (e.button === 2) setAds(true);
  });
  window.addEventListener('pointerup', (e) => {
    releaseFire();
    if (e.button === 2) setAds(false);
  });
  window.addEventListener('pointercancel', releaseFire);
  window.addEventListener('blur', releaseFire);
  document.addEventListener('visibilitychange', releaseFire);

  btnFire.addEventListener('pointerdown', (e) => { e.preventDefault(); pressFire(); });
  btnRel.addEventListener('click', () => { resumeAudio(); startReload(); });
  btnAds.addEventListener('click', () => { resumeAudio(); setAds(!camState.ads); });
  if (btnSnd) btnSnd.addEventListener('click', () => {
    audio.on = !audio.on;
    btnSnd.classList.toggle('muted', !audio.on);
    if (audio.on) { resumeAudio(); audio.handle(); }
  });

  /* ATTACH: интерфейс */
  const attachApply = ATTACH_STATE.apply = (slotKey, moduleKey) => {
    ATTACH_STATE.ui && ATTACH_STATE.ui.markStats();
    ATTACH_STATE.config[slotKey] = moduleKey;
    ATTACH_ASM = attachRebuildAK();
    attachSyncMuzzle();
    attachSyncSight();
    attachSyncAmmo();
    ATTACH_STATE.ui && ATTACH_STATE.ui.render();
  };
  const attachSyncAmmo = () => {
    const cap = (ATTACH_ASM && ATTACH_ASM.derived.magCap) || MAG;
    magCap = cap;
    if (ammo > cap) setAmmo(cap);
    const cell = document.querySelector('#hud i');
    if (cell) cell.textContent = '5,45×39 · МАГАЗИН ' + cap;
  };
  ATTACH_STATE.ui = createCustomizer({
    getConfig: () => ATTACH_STATE.config,
    getSlots: () => attachSlots(),
    getStats: () => (ATTACH_ASM ? ATTACH_ASM.derived : {}),
    getWarnings: () => (ATTACH_ASM ? ATTACH_ASM.warnings : []),
    optionsFor: attachOptionsFor,
    nameOf: attachNameOf,
    setModule: attachApply
  });
  ATTACH_STATE.ui.render();
  ATTACH_STATE.ui.toggle(false);
  window.__MEASURE_HOST = gun; window.__MEASURE_THREE = THREE;
  /* Отладка прицеливания: где стоит камера и куда смотрит. */
  window.__ADS_DEBUG = () => ({
    ads: camState.ads, k: camState.k, fov: camera.fov, fovAds: camState.fovAds,
    optic: camState.optic ? camState.optic.meta.name : 'механика',
    camera: camera.position.toArray().map((v) => Math.round(v * 1000)),
    anchor: adsAnchor.getWorldPosition(new THREE.Vector3()).toArray().map((v) => Math.round(v * 1000)),
    eye: ATTACH_ASM && ATTACH_ASM.nodes.eye
  });
  window.__ATTACH_DEBUG = () => ({
    magGroup: (function () {
      const g = ATTACH_STATE.view.slots.mag;
      if (!g) return 'нет группы mag';
      const box = new THREE.Box3().setFromObject(g);
      return { parent: g.parent && g.parent.name, children: g.children.length,
        visible: g.visible, min: box.min.toArray(), max: box.max.toArray() };
    })(),
    config: ATTACH_STATE.config,
    modules: Object.keys(ATTACH_ASM.modules),
    parts: ATTACH_ASM.parts.length,
    errors: ATTACH_ASM.errors, warnings: ATTACH_ASM.warnings,
    children: ATTACH_STATE.view.root.children.map((c) => c.name + ':' + c.children.length),
    rootParent: ATTACH_STATE.view.root.parent && ATTACH_STATE.view.root.parent.name,
    nodes: ATTACH_ASM.nodes
  });
  attachBindKeys(attachApply);
  attachSyncAmmo();

  /* ================= цикл ================= */
  setAmmo(magCap);
  let prev = performance.now();
  const tick = () => {
    requestAnimationFrame(tick);
    const now = performance.now();
    let dt = (now - prev) / 1000;
    prev = now;
    if (dt > 0.05) dt = 0.05;
    if (st.hold) shoot();
    updateGun(dt);
    updateFX(dt);
    updateCamera(dt, now);
    renderer.render(scene, camera);
  };
  tick();
}

try { main(); } catch (e) { showErr(e); }

</script>
</body>
</html>
